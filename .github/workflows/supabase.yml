name: Servidor de Mi PandarIA (Supabase)

# Aplica las migraciones de supabase/migrations al proyecto «pandaria».
# Solo desde la rama de Mi PandarIA y a mano o al cambiar una migración. Las claves están en los secretos del repositorio.
on:
  workflow_dispatch:
  push:
    branches: [lab-mi-pandaria]
    paths: ['supabase/migrations/**']

jobs:
  migrar:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/lab-mi-pandaria'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Comprobar secretos
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do [ -n "${!v}" ] || { echo "Falta el secreto $v"; exit 1; }; done
          [ "$SUPABASE_PROJECT_REF" = "vjvhpumsfsktkavtxigk" ] || { echo "ERROR: el secreto SUPABASE_PROJECT_REF no es el del proyecto pandaria"; exit 1; }
      - name: Enlazar el proyecto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Ver qué quedó aplicado
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
