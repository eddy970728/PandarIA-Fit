name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Conectar el codigo nativo al HTML
        run: |
          grep -q 'premium.js' www/index.html || sed -i 's#</body>#<script src="native.js"></script><script src="premium.js"></script></body>#' www/index.html
          sed -i '0,/<head>/s##<head><script>window.PF_BUILD=${{ github.run_number }}</script>#' www/index.html
          node -e "const h=require('fs').readFileSync('www/index.html','utf8');const m=h.match(/const NOTAS_VERSION=(\[[^\n]*\]);/);const n=m?JSON.parse(m[1]):[];require('fs').writeFileSync('notas.md','Versión de prueba 0.7.${{ github.run_number }}. Descarga PandarIA-Fit.apk e instálala encima de la anterior.\n\n'+n.map(x=>'- '+x).join('\n')+'\n')"
          cat notas.md

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#12151a' --iconBackgroundColorDark '#12151a' --splashBackgroundColor '#12151a' --splashBackgroundColorDark '#12151a'
          npx cap sync android
          node scripts/android-extra.mjs

      - name: Numero de version automatico
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"0.7.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > firma.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $IN alineado.apk
          $BT/apksigner sign --ks firma.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out PandarIA-Fit.apk alineado.apk
          $BT/apksigner verify PandarIA-Fit.apk
          rm firma.jks

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.${{ github.run_number }}
          name: PandarIA Fit 0.7.${{ github.run_number }}
          body_path: notas.md
          files: PandarIA-Fit.apk
