<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#181c23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="PandarIA Fit: rutinas, entrenamiento guiado, historial y un algoritmo que te ayuda a progresar.">
<title>PandarIA Fit</title>
<style>
:root{
  --bg:#12151a; --bg2:#181c23; --card:#1f242d; --card2:#282e39; --line:#2f3642;
  --tx:#eef1f5; --mut:#8b94a3; --mut2:#5d6573;
  --ac:#ff7a1a; --ac2:#ff9a4d; --acs:rgba(255,122,26,.14);
  --ok:#2fd27a; --oks:rgba(47,210,122,.16); --bad:#ff4d5a; --bads:rgba(255,77,90,.14);
  --blue:#4aa8ff; --blues:rgba(74,168,255,.14); --gold:#ffc83d;
  --r:16px; --nav:64px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --bg2:#ffffff; --card:#ffffff; --card2:#eef0f4; --line:#e1e4ea;
  --tx:#161a20; --mut:#69717f; --mut2:#9aa1ad;
  --acs:rgba(255,122,26,.12); --oks:rgba(47,180,100,.14); --ok:#22b465;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
svg{display:block}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:0 16px calc(var(--nav) + 24px + var(--safe-b));-webkit-overflow-scrolling:touch}
/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:500;position:relative}
#nav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
#nav button.on{color:var(--tx)}
#nav button.on .pill{background:var(--acs);color:var(--ac)}
#nav .dot{position:absolute;top:8px;left:calc(50% + 12px);width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--bg2)}
/* Header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:26px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
.hdr .sub{color:var(--mut);font-size:13px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{color:var(--ac)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--card2);color:var(--tx);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:#1a0d02}
.btn.ok{background:var(--ok);color:#03200f}
.btn.ghost{background:transparent;color:var(--ac)}
.btn.danger{background:var(--bads);color:var(--bad)}
.btn.big{height:58px;font-size:17px;border-radius:18px;width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--tx)}
.ibtn:active{background:var(--card2)}
.ibtn.soft{background:var(--card2)}
.link{color:var(--ac);font-weight:700;letter-spacing:.3px}
/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:11.5px}
.b{font-weight:700} .ttl{font-size:17px;font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:22px 2px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--card2);color:var(--tx);font-size:13.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.tag.ac{background:var(--acs);color:var(--ac)}
.tag.ok{background:var(--oks);color:var(--ok)}
.tag.blue{background:var(--blues);color:var(--blue)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:8px}
.diff{display:inline-flex;gap:3px;align-items:flex-end}
.diff i{width:5px;border-radius:2px;background:var(--mut2)}
.diff i:nth-child(1){height:7px}.diff i:nth-child(2){height:11px}.diff i:nth-child(3){height:15px}
.diff.l1 i:nth-child(1),.diff.l2 i:nth-child(-n+2),.diff.l3 i{background:var(--ac)}
/* Routine card */
.rcard .exs{color:var(--mut);font-size:13.5px;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--ac);display:inline-block}
.newbtn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:var(--r);background:var(--ac);color:#1a0d02;font-weight:800;font-size:16px;margin-bottom:16px}
.newbtn .pl{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.14);display:grid;place-items:center}
/* Banner */
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;background:var(--acs);border:1px solid rgba(255,122,26,.3)}
.banner.blue{background:var(--blues);border-color:rgba(74,168,255,.3)}
.banner.ok{background:var(--oks);border-color:rgba(47,210,122,.3)}
.banner .ic{flex:0 0 auto;color:var(--ac)}
.banner.blue .ic{color:var(--blue)} .banner.ok .ic{color:var(--ok)}
/* Exercise icon */
.exi{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative;overflow:hidden}
.exi.sm{width:36px;height:36px;border-radius:10px}
.onclr .diff i{background:rgba(255,255,255,.35)}
.onclr .diff.l1 i:nth-child(1),.onclr .diff.l2 i:nth-child(-n+2),.onclr .diff.l3 i{background:#fff}
.exi.lg{width:96px;height:96px;border-radius:24px}
.exi .ini{font-weight:800;font-size:16px}
/* Layers */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:slin .22s ease}
.layer .lhdr{display:flex;align-items:center;gap:6px;padding:10px 8px;min-height:62px;border-bottom:1px solid var(--line);background:var(--bg2)}
.layer .lhdr h2{flex:1;margin:0;font-size:18px;font-weight:700;padding-left:4px}
.layer .lbody{flex:1;overflow-y:auto;padding:16px 16px 40px}
.layer .lfoot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg2)}
@keyframes slin{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.scrim.center{align-items:center;padding:20px}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--safe-b));animation:up .2s ease;max-height:88vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:4px 4px 14px;font-size:19px}
.modal{width:100%;max-width:420px;background:var(--bg2);border-radius:22px;padding:22px;animation:up .2s}
.modal h3{margin:0 0 8px;font-size:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 10px;border-radius:14px;text-align:left}
.opt:active{background:var(--card2)}
.opt .oi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--acs);color:var(--ac);flex:0 0 auto}
.opt.danger{color:var(--bad)} .opt.danger .oi{background:var(--bads);color:var(--bad)}
.opt .od{color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 8px;font-size:15.5px;border-radius:12px;text-align:left}
.mi:active{background:var(--card2)}
.mi svg{color:var(--blue)} .mi.danger,.mi.danger svg{color:var(--bad)}
/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:7px}
.inp{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--ac)}
textarea.inp{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:13px;top:13px;color:var(--mut)}
.search .inp{padding-left:42px}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--ac)} .toggle.on::after{left:23px}
.srow{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .si{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--ac);flex:0 0 auto}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut2);display:grid;place-items:center;flex:0 0 auto}
.check.on{background:var(--ac);border-color:var(--ac);color:#1a0d02}
input[type=range]{width:100%;accent-color:var(--ac)}
/* Workout */
.wk-top{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:62px;background:var(--bg2);border-bottom:1px solid var(--line)}
.wk-top .clock{flex:1;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums;font-size:16px}
.wk-ex{margin:0 -16px;padding:18px 16px 6px;border-bottom:8px solid var(--bg2)}
.wk-ex .exh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wk-ex .exn{flex:1;min-width:0;color:var(--blue);font-weight:700;font-size:17px;line-height:1.25}
.wk-ex .note{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:8px;color:var(--mut)}
.wk-ex .note.sticky{background:rgba(255,200,61,.12);color:var(--gold)}
.sgrid{display:grid;grid-template-columns:40px 1fr 74px 74px 46px;align-items:center;gap:8px}
.sgrid.nokg{grid-template-columns:40px 1fr 96px 46px}
.shead{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--mut);padding:4px 0 6px;text-align:center}
.shead>:nth-child(2){text-align:left}
.srw{padding:5px 0;border-radius:10px;transition:background .2s}
.srw.done{background:var(--oks)}
.snum{height:40px;border-radius:10px;font-weight:700;display:grid;place-items:center;font-size:15px}
.snum.c{color:var(--gold)} .snum.f{color:var(--bad)} .snum.d{color:var(--blue)}
.sprev{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinp{width:100%;height:42px;border-radius:10px;border:0;background:var(--card2);text-align:center;font-size:17px;font-weight:600;outline:none;padding:0 4px;-moz-appearance:textfield}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none}
.sinp::placeholder{color:var(--mut2);font-weight:500}
.sinp:focus{box-shadow:0 0 0 2px var(--ac)}
.srw.done .sinp{background:transparent}
.sck{width:42px;height:42px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut2)}
.srw.done .sck{background:var(--ok);color:#03200f}
.restline{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:14px;font-weight:600;padding:2px 0}
.restline::before,.restline::after{content:'';flex:1;height:3px;border-radius:2px;background:var(--blues)}
.restline.done{color:var(--ok)} .restline.done::before,.restline.done::after{background:var(--oks)}
.restbar{position:relative;height:44px;border-radius:12px;background:var(--card2);overflow:hidden;margin:6px 0;display:flex;align-items:center}
.restbar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);transition:width 1s linear}
.restbar .t{position:relative;flex:1;text-align:center;font-weight:800;font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
.restbar button{position:relative;width:52px;height:100%;font-weight:700;color:#fff;font-size:13px}
.ssup{border-left:3px solid var(--ac);padding-left:10px;margin-left:-13px}
.suptag{font-size:11px;color:var(--ac);font-weight:800;letter-spacing:.8px;margin-bottom:6px}
.minibar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--safe-b));z-index:25;max-width:536px;margin:0 auto;background:var(--ac);color:#1a0d02;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + var(--safe-b));transform:translateX(-50%);z-index:80;background:var(--card2);color:var(--tx);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s;max-width:90vw;text-align:center;border:1px solid var(--line)}
.in-layer .toast{bottom:auto;top:74px}
.toast.pr{background:var(--gold);color:#2a1d00}
/* Edit routine */
.eitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.eitem.sup{border-left:4px solid var(--ac)}
.esets{display:grid;grid-template-columns:40px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:10px}
.esets.nokg{grid-template-columns:40px 1fr 34px}
.esets .sinp{height:38px;font-size:15px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13.5px;position:relative}
.cal .d.on{background:var(--ac);color:#1a0d02;font-weight:800}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ac)}
.cal .d.out{opacity:.25}
.stat{background:var(--card2);border-radius:14px;padding:12px;flex:1;min-width:0}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach .a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.ach .a .e{font-size:28px;filter:grayscale(1);opacity:.35}
.ach .a.on .e{filter:none;opacity:1}
.ach .a .n{font-size:12.5px;font-weight:700;margin-top:6px}
.ach .a .dd{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.photo{width:100%;border-radius:12px;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
/* Explore */
.xsec{margin-top:22px}
.xsec .xh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.xcards{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.xcards::-webkit-scrollbar{display:none}
.xcard{flex:0 0 74%;max-width:280px;scroll-snap-align:start;border-radius:18px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;position:relative;overflow:hidden}
.xcard .xn{font-weight:800;font-size:17px;line-height:1.2;position:relative}
.xcard .xm{font-size:12.5px;opacity:.9;position:relative;display:flex;gap:10px;align-items:center}
.xcard .diff i{background:rgba(255,255,255,.35)}
.xcard .diff.l1 i:nth-child(1),.xcard .diff.l2 i:nth-child(-n+2),.xcard .diff.l3 i{background:#fff}
.xcard svg.bgi{position:absolute;right:-8px;bottom:-8px;opacity:.22}
.xhero{border-radius:20px;padding:18px;background:linear-gradient(135deg,var(--ac),#ff4f3a);color:#1a0702;margin:4px 0 6px}
.xhero h2{margin:0 0 6px;font-size:19px;line-height:1.25}
.xhero p{margin:0;font-size:13px;opacity:.85;line-height:1.4}
/* Summary */
.sumhero{text-align:center;padding:20px 0 10px}
.sumhero .big{font-size:54px}
.int-wrap{padding:6px 2px}
.int-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.int-val{font-size:30px;font-weight:800;text-align:center;margin:6px 0}
.chart text{fill:var(--mut);font-size:10px}
.bodymap .base{fill:var(--card2)}
.sugg{border-radius:var(--r);border:1px solid rgba(255,122,26,.35);background:var(--acs);padding:14px;margin-bottom:10px}
.sugg .why{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.sugg .acts{display:flex;gap:8px;margin-top:12px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:120px;margin:12px 0}
.plates .bar{width:60px;height:10px;background:#9aa1ad;border-radius:3px}
.plates .p{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;writing-mode:vertical-rl}
.drag{color:var(--mut2)}
@media (min-width:561px){body{background:#0b0d10}}

.exi .exfig{width:86%;height:86%}
.exanim{border-radius:22px;aspect-ratio:1;width:100%;max-width:260px;margin:0 auto;padding:6%}
.exanim svg{display:block}

.stprow{padding:0 0 4px}
.stp2{display:flex;gap:6px}
.stb{flex:1;height:30px;border-radius:9px;background:var(--card2);color:var(--ac);font-weight:800;font-size:18px;line-height:1}
.stb:active{background:var(--acs)}
.sck.play{color:var(--ok);background:var(--oks)}
.tbar .fill{background:var(--ok)}
.tbar.pre .fill{background:var(--gold)}
.rirrow{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:2px 0 6px}
.rirb{min-width:34px;height:28px;border-radius:8px;background:var(--card2);font-weight:700;font-size:13px}
.rirb.on{background:var(--ok);color:#03200f}

@property --p{syntax:'<number>';inherits:true;initial-value:0}

@keyframes ringIn{from{--p:0}}

html[data-fx=on] #view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}

html[data-fx=on] .fx-pop{animation:popRow .45s ease}
html[data-fx=on] .fx-pr{animation:prRow .9s ease;position:relative;z-index:2;border-radius:12px}
html[data-fx=on] .fx-splash{animation:splash .5s ease}

html[data-fx=on] .toast.pr{animation:up .2s,glow 1.2s ease .2s 2}

html[data-fx=on] .rcard,html[data-fx=on] .card{transition:transform .15s}
html[data-fx=on] .tick-fast{animation:breathe 4s ease-in-out infinite}
html[data-fx=on] #nav button.fx-splash .pill{animation:splash .4s ease}
html[data-fx=off] *,html[data-fx=off] *::before{animation:none!important;transition:none!important}

   - Rangos de repeticiones, series y descansos por objetivo.
   - Sobrecarga progresiva con doble progresión y aumentos de carga del 2–10 %.

   - Descarga periódica, ajuste por desentrenamiento y por esfuerzo percibido.
*/
const EX = {};
function loadExercises(custom){
  for (const k in EX) delete EX[k];
  EX_RAW.trim().split('\n').forEach(line=>{
    const [id,n,pat,eq,prim,sec,kind,lvl,mode,tip]=line.split('|');
    EX[id]={id,n,pat,eq:eq.split('+'),prim:prim.split(','),sec:sec?sec.split(','):[],kind,lvl:+lvl,mode,tip:tip||''};
  });
  (custom||[]).forEach(c=>{ EX[c.id]=Object.assign({sec:[],kind:'c',lvl:1,tip:'',custom:true},c); });
}

const LOWER_MUSCLES = ['cuadriceps','isquios','gluteos','gemelos','aductores','abductores'];
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const DAY = 86400000;
const roundTo = (v,step)=> Math.max(step, Math.round(v/step)*step);
const e1rm = (kg,reps)=> kg*(1+Math.min(reps,20)/30);
const userLevel = () => LEVELS[S.settings.level]||1;
const isLower = ex => ex.prim.some(m=>LOWER_MUSCLES.includes(m)) || ['sentadilla','bisagra','zancada','gluteo'].includes(ex.pat);
function incFor(ex){
  const e = ex.eq;
  if (e.includes('bar')||e.includes('smi')||e.includes('hex')||e.includes('ez')) return (S.settings.minPlate||1.25)*2;
  if (e.includes('lmn')) return 2.5; // un solo extremo cargado
  if (e.includes('kb')) return 4;
  if (e.includes('man')) return 2;
  if (e.includes('maq')) return 5;
  if (e.includes('pol')) return 2.5;
  return 2.5;
}
function hasEquip(ex, set){
  set = set || S.settings.equip;
  return ex.eq.every(q => q==='pc' || q==='est' || set.includes(q));
}
const avoided = id => !!(S.settings.avoid||{})[id] || (typeof profileBlocks==='function' && profileBlocks(id));

/* ---------- Historial ---------- */
function exHistory(exId, limit){
  const out=[];
  for (let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    const it=s.items.find(x=>x.exId===exId);
    if (!it) continue;

function prescribe(ex, goal, level){

  let sets = G.sets + (level===1?-1:level===3?1:0);
  let range = G.reps.slice();
  let rest = G.rest;
  if (ex.kind==='a'){ sets=Math.min(sets,3); range=[range[0]+2,range[1]+3]; rest=Math.min(rest,90); }
  if (goal==='fuerza' && ex.kind==='a'){ range=[8,12]; rest=90; }
  sets=Math.max(2,Math.min(5,sets));
  let time=null;
  if (ex.mode==='t'){
    if (ex.pat==='cardio' && ['cin','bic','eli','rem'].some(q=>ex.eq.includes(q))){ sets=1; time=goal==='grasa'||goal==='resistencia'?1200:600; rest=60; }
    else if (['yoga','estiramiento','movilidad'].includes(ex.pat)){ time= ex.id==='mov_articular'?300: ex.id==='yoga_saludo'?180:G.t+5; sets= ex.id==='mov_articular'?1:2; rest=10; }
    else if (ex.id==='caminata'){ sets=1; time=900; rest=30; }
    else time = G.t + (level-1)*10;
  }
  if (ex.mode==='r' && ex.pat==='cardio'){ range=[10,15]; }
  if (ex.mode==='r' && level===1 && ex.kind==='c') range=[Math.max(6,range[0]-2),range[1]];
  const pr=S.profile||{};
  if (pr.age>=50 && ex.mode!=='t') rest+=15;
  if (pr.fitness==='sedentario' && ex.mode!=='t' && sets>2) sets-=1;
  if (pr.age && pr.age<18 && range[0]<6) range=[6,Math.max(range[1],10)];
  return {sets, range, rest, time};
}
function buildItem(exId, goal, level, opts){
  const ex=getEx(exId), p=prescribe(ex,goal,level);
  const kg = ex.mode==='p' ? estimateKg(exId, p.range[0]) : null;
  const sets=[];
  for (let i=0;i<p.sets;i++) sets.push({t:'n', reps: ex.mode==='t'?null:p.range[0], kg: kg, time:p.time});
  return Object.assign({uid:uid(), exId, sets, rest:p.rest, range: ex.mode==='t'?null:p.range, superset:null, note:'', sticky:''}, opts||{});
}

const EQ_FACTOR = {hex:1.05, bar:1, smi:0.9, ez:0.95, maq:1, lmn:0.5, pol:0.7, man:0.4, kb:0.35};

  sentadilla:[0.8,1.1,1.5], bisagra:[1.0,1.3,1.8], zancada:[0.5,0.7,0.9], empuje_h:[0.6,0.85,1.1], empuje_v:[0.4,0.55,0.7],
  tiron_h:[0.55,0.75,1.0], tiron_v:[0.6,0.8,1.0], curl:[0.25,0.35,0.45], extension:[0.2,0.3,0.4], elevacion:[0.25,0.35,0.45],
  apertura:[0.3,0.4,0.5], gluteo:[1.0,1.4,1.9], ext_pierna:[0.5,0.7,0.9], curl_pierna:[0.35,0.5,0.65], gemelo:[0.8,1.1,1.4],

function bodyWeight(){ const m=[...S.measures].reverse().find(x=>x.peso); return m? +m.peso : (S.profile&&+S.profile.weight)||70; }
function estimateKg(exId, reps){
  const ex=getEx(exId); if (ex.mode!=='p') return null;
  const own = exHistory(exId,1)[0];
  if (own){ const b=own.sets.reduce((a,x)=>(+x.kg||0)>a?+x.kg:a,0); if (b) return b; }
  // ejercicio relacionado con historial
  let best=null;

    const o=EX[id]; if (id===exId||o.mode!=='p'||o.pat!==ex.pat||!o.prim.some(m=>ex.prim.includes(m))) continue;
    const h=exHistory(id,1)[0]; if (!h) continue;

  if (ph==='intensidad') range=[Math.max(1,range[0]-2),Math.max(2,range[1]-2)];

  const res={kg:set.kg, reps:set.reps, time:set.time, why:''};
  if (set.t==='c'){ // calentamiento: % del peso de trabajo
    const target = suggestSet(routine,item,item.sets.indexOf(work[0]||set));
    const wu=item.sets.filter(x=>x.t==='c'); const k=wu.indexOf(set);
    const pct=[0.5,0.7,0.85][Math.min(k,2)];

  const days=(Date.now()-last.date)/DAY;
  if (ex.mode==='p'){

    const fails = h => h && h.sets.some(x=>(+x.reps||0)<range[0]);
    const twoFails = fails(hist[0]) && fails(hist[1]);

    } else if (twoFails){
      kg=roundTo(kg*0.9, incFor(ex)); reps=range[0]; res.why='Dos sesiones sin llegar: bajamos 10 % para consolidar';
    } else if (last.intensity>=9){ reps=Math.min(reps,range[1]); res.why='Sesión anterior muy exigente: mantén'; }
    else { const rr=last.sets.map(x=>x.rir).filter(x=>x!=null); const ra=rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null;
      reps=Math.max(range[0],Math.min(reps+(ra!=null&&ra>=3?2:1),range[1])); res.why= (+ref.reps||0)<range[0]?'Mismo peso: busca llegar al mínimo de repeticiones':'Intenta una repetición más'; }

    else if (ph==='descarga'){ kg=roundTo(kg*0.85,incFor(ex)); res.why='Semana de descarga del bloque: más liviano'; }

  } else {

}

function fillDay(slots, opts){
  const ctx={level:opts.level, goal:opts.goal, equip:opts.equip, dayUsed:new Set(), dayPat:new Set(), progUsed:opts.progUsed||new Set(), idx:0};
  const items=[]; let mins=0; const budget=opts.minutes;
  const warm = budget>=25 && opts.goal!=='flexibilidad';
  const older=(S.profile||{}).age>=50;
  if (warm){ const w=buildItem('mov_articular',opts.goal,opts.level); w.sets=[{t:'n',time:older?420:300,reps:null,kg:null}]; w.rest=10; w.warm=true; items.push(w); mins+=older?7:5; }
  const cool = budget>=30 ? 4 : 0;
  let i=0, guard=0;
  while (guard++<40){
    const slot=slots[i%slots.length]; i++;
    if (i>slots.length*2) break;
    ctx.strict = i>slots.length;
    ctx.idx=items.length;
    const id=pickExercise(slot,ctx)||pickExercise(SLOT(slot.m,null),ctx)||pickSecondary(slot.m,ctx); if (!id) continue;
    const it=buildItem(id,opts.goal,opts.level);
    const m=itemMinutes(it);
    if (mins+m+cool>budget && items.filter(x=>!x.warm).length>=3) break;
    items.push(it); ctx.dayUsed.add(id); ctx.progUsed.add(id); ctx.dayPat.add(EX[id].pat+'|'+EX[id].prim[0]); mins+=m;
    if (items.filter(x=>!x.warm).length>=10) break;
  }
  items.splice(0,items.length,...orderItems(items));
  if (opts.goal==='grasa'){ // circuitos: pares en superserie
    const work=items.filter(x=>!x.warm);
    for (let k=0;k+1<work.length;k+=2){ const g=uid(); work[k].superset=g; work[k+1].superset=g; work[k].rest=15; }
  }
  if ((opts.goal==='grasa'||opts.goal==='resistencia') && opts.equip){ // final de cardio
    ctx.idx=99; ctx.strict=false; const c=pickExercise(SLOT('cardio',['cardio']),ctx);
    if (c && mins+4<budget+5){ const it=buildItem(c,opts.goal,opts.level); items.push(it); }
  }
  if ((S.profile||{}).age>=65 && !items.some(x=>x.exId==='equilibrio_pierna')){ const b=buildItem('equilibrio_pierna','salud',opts.level); b.sets.forEach(s=>s.time=30); items.push(b); }
  if (cool){
    const main = items.filter(x=>!x.warm).map(x=>getEx(x.exId).prim[0]);
    const st = Object.values(EX).find(o=>o.pat==='estiramiento' && main.includes(o.prim[0])) || EX.est_isquios;
    const it=buildItem(st.id,'flexibilidad',opts.level); it.sets=[{t:'n',time:40,reps:null,kg:null}]; it.cool=true; items.push(it);
  }
  return items;
}
function generateProgram(o){
  // o: {goal, days, minutes, level, priorities[], equip}
  const level=o.level, goal=o.goal;
  const keys = goal==='flexibilidad' ? Array(Math.min(o.days,4)).fill('flex') : SPLITS[o.days]||SPLITS[3];
  const progUsed=new Set();
  const counts={};
  return keys.map((k,di)=>{
    counts[k]=(counts[k]||0)+1;
    const d=DAYS[k];
    let slots=d.s.slice();
    const reg = m => LOWER_MUSCLES.includes(m)?'lower':['abdomen','oblicuos','lumbar'].includes(m)?'core':'upper';
    (o.priorities||[]).forEach(m=>{ const pats=MUSCLE_PATTERNS[m]; if(!pats) return;
      if (reg(m)!=='core' && !k.startsWith('full') && !d.s.some(s=>s.m===m)) return; // solo en días que trabajan ese músculo
      const s=SLOT(m,pats.slice()); s.strict=true; slots.splice(2,0,s); });
    const items=fillDay(slots,{level,goal,minutes:o.minutes,equip:o.equip,progUsed});
    const sfx = keys.filter(x=>x===k).length>1 ? ' '+String.fromCharCode(64+counts[k]) : '';
    return {name:`${d.n}${sfx}`, items};
  });
}
function generateByMuscles(o){
  const slots=[];
  const maxPer=3;
  for (let r=0;r<maxPer;r++) o.muscles.forEach(m=>{ const p=(MUSCLE_PATTERNS[m]||['core'])[r]; if(p) slots.push(SLOT(m,[p])); });
  const ctx={level:o.level,goal:o.goal,equip:o.equip,dayUsed:new Set(),dayPat:new Set(),progUsed:new Set(),idx:0};
  const items=[]; let mins=0;
  if (o.minutes>=25){ const w=buildItem('mov_articular',o.goal,o.level); w.sets=[{t:'n',time:300}]; w.rest=10; w.warm=true; items.push(w); mins+=5; }
  for (const slot of slots){
    ctx.idx=items.length;
    let id=pickExercise(slot,ctx)||pickExercise(SLOT(slot.m,null),ctx)||pickSecondary(slot.m,ctx);
    if (!id) continue;
    const it=buildItem(id,o.goal,o.level); const m=itemMinutes(it);
    if (mins+m>o.minutes && items.filter(x=>!x.warm).length>=o.muscles.length) break;
    items.push(it); ctx.dayUsed.add(id); ctx.dayPat.add(EX[id].pat+'|'+EX[id].prim[0]); mins+=m;
  }
  items.splice(0,items.length,...orderItems(items));
  if (o.minutes>=30){ const main=o.muscles; const st=Object.values(EX).find(x=>x.pat==='estiramiento'&&main.includes(x.prim[0]))||EX.est_isquios; const it=buildItem(st.id,'flexibilidad',o.level); it.sets=[{t:'n',time:40}]; it.cool=true; items.push(it); }
  return items;
}
function templateItems(tpl, goal){
  const L=userLevel();
  return tpl.ex.filter(id=>EX[id]).map(id=>{
    let use=id;
    if (!hasEquip(EX[id])||avoided(id)){ const a=alternatives(id)[0]; if (a) use=a; }
    const it=buildItem(use, goal||tpl.g, L);
    if (tpl.g==='grasa' && getEx(use).mode==='t'){ it.sets.forEach(s=>s.time=30); it.rest=20; }
    return it;
  });
}

/* ---------- Análisis tras cada entrenamiento ---------- */
function weeksSince(ts){ return (Date.now()-ts)/(7*DAY); }
function trainedWeeksSince(ts){
  const wk=new Set(S.sessions.filter(s=>s.end>ts).map(s=>weekKey(s.end)));
  return wk.size;
}
function weekKey(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function hasSugg(r, kind, itemUid){ return (r.sugg||[]).some(x=>x.kind===kind && (!itemUid||x.uid===itemUid)); }
function setsFromSuggest(r,it){ return it.sets.map((s,i)=>{ const g=suggestSet(r,it,i); return Object.assign({},s,{kg:g.kg??s.kg, reps:g.reps??s.reps, time:g.time??s.time}); }); }
function afterSession(session){
  const r=S.routines.find(x=>x.id===session.routineId);
  const created=[];
  if (!r) return created;
  r.completions=(r.completions||0)+1; r.lastDone=session.end;
  r.exCount=r.exCount||{};
  if (!r.pandaria) return created;
  r.sugg=r.sugg||[];
  const push = s=>{
    if (s.uid){ r.sugg=r.sugg.filter(x=>x.uid!==s.uid); const g=r.sugg.find(x=>x.kind==='actualizar'); if(g){ g.data.items=g.data.items.filter(i=>i.uid!==s.uid); if(!g.data.items.length) r.sugg=r.sugg.filter(x=>x!==g); } }
    s.id=uid(); s.created=Date.now(); r.sugg.push(s); created.push(s);
  };
  const updates=[];
  session.items.forEach(si=>{
    const it=r.items.find(x=>x.exId===si.exId); if(!it) return;
    r.exCount[si.exId]=(r.exCount[si.exId]||0)+1;
    if ((S.settings.avoid||{})[si.exId]==='molesta'){
      const a=alternatives(si.exId, r.items.map(x=>x.exId))[0];
      if (a && !hasSugg(r,'cambiar',it.uid)) push({kind:'cambiar',uid:it.uid,exId:si.exId,title:`Cambiar ${getEx(si.exId).n}`,text:`Marcaste que te molesta. Propongo ${getEx(a).n}, que trabaja lo mismo con otro ángulo.`,why:'Entrenar con molestias aumenta el riesgo de lesión. Si el dolor persiste, consulta a un profesional.',data:{to:a}});
      return;
    }
    if (r.exCount[si.exId]%3!==0) return;
    const res=reviewExercise(r,it);
    if (!res) return;
    if (res.progress){ if (!(r.sugg||[]).some(x=>x.uid===it.uid)) updates.push(res); }
    else push(res);
  });
  if (updates.length){
    let g=r.sugg.find(x=>x.kind==='actualizar');
    if (!g){ g={kind:'actualizar',title:'Actualizar pesos de la rutina',data:{items:[]},why:'La sobrecarga progresiva es la base de las ganancias de fuerza y músculo.'}; push(g); }
    updates.forEach(u=>{ g.data.items=g.data.items.filter(i=>i.uid!==u.uid); g.data.items.push(u); });
    g.text=`Progresaste en ${plural(g.data.items.length,'ejercicio','ejercicios')}. Actualizo la rutina con tus nuevos números: `+g.data.items.map(i=>i.line).join(' · ')+'.';
  }
  if (r.completions%15===0){
    r.sugg=r.sugg.filter(x=>x.kind!=='renovar');
    const ren=renewRoutine(r);
    if (ren.change) push({kind:'renovar',title:'Rutina renovada lista',text:`Hiciste esta rutina ${r.completions} veces. Analicé cada ejercicio en todo tu historial: ${ren.keep} se mantienen y ${ren.change} ${ren.change===1?'cambia':'cambian'} para seguir progresando.`,why:ren.lines.join(' · '),data:{items:ren.items}});
  }
  const since=S.lastDeload||S.firstSession||session.end;
  const stagnant=r.sugg.filter(x=>x.stagnant).length;
  const recent=S.sessions.slice(-5).filter(s=>s.checkin);
  if (recent.length>=3 && recent.filter(s=>s.checkin.sleep===0||s.checkin.energy===0).length>=3 && !hasSugg(r,'recuperacion'))
    push({kind:'recuperacion',title:'Tu recuperación necesita atención',text:'En varios check-in marcaste poco sueño o poca energía. Prioriza dormir 7 a 9 horas y, si sigue así, haz una semana más liviana.',why:'El sueño insuficiente reduce la fuerza y la recuperación muscular.',data:{}});
  if (S.settings.period===false && !deloadActive() && S.sessions.length>=6 && (trainedWeeksSince(since)>=6 || stagnant>=2) && !hasSugg(r,'descarga')){
    push({kind:'descarga',title:'Semana de descarga',text:'Llevas varias semanas apretando. Una semana con menos peso ayuda a recuperarte y volver más fuerte.',why:'Se recomienda una descarga cada 4–8 semanas de entrenamiento intenso o tras estancarse.',data:{}});
  }
  return created;
}
const maxKg = e => Math.max(0,...e.sets.map(s=>+s.kg||0));
function reviewExercise(r, it){
  const ex=getEx(it.exId);
  if (it.warm||it.cool||['movilidad','estiramiento'].includes(ex.pat)||ex.missing) return null;
  const h=exHistory(it.exId,4);
  if (h.length<3) return null;
  const tired = c => c && (c.sleep===0 || c.energy===0);
  const sc=h.map(e=>sessionScore(e,ex)); // reciente → antiguo
  const last=sc[0], first=sc[sc.length-1], prevMax=Math.max(...sc.slice(1));
  const avgInt=h.reduce((a,e)=>a+e.intensity,0)/h.length;
  const name=ex.n;
  if (ex.mode==='r'){
    const range=it.range||[8,12];
    const lastReps=Math.min(...h[0].sets.map(x=>+x.reps||0));
    const nx=nextProgression(it.exId);
    if (lastReps>=range[1]+3 && nx && !avoided(nx)) return {kind:'cambiar',uid:it.uid,exId:it.exId,title:`Sube de nivel: ${getEx(nx).n}`,text:`Haces ${lastReps} repeticiones limpias de ${name}. Es momento de pasar a ${getEx(nx).n}.`,why:'En calistenia se progresa con variantes más difíciles cuando superas el rango objetivo.',data:{to:nx}};
  }
  // de la versión guiada (Smith o máquina) a la libre, cuando ya progresa con estabilidad
  if (ex.mode==='p' && ex.eq.some(q=>['smi','maq'].includes(q)) && userLevel()>=2 && h.length>=6 && last>=first*1.05 && avgInt<=8){
    const nx=nextProgression(it.exId);
    if (nx && !avoided(nx) && hasEquip(getEx(nx)) && getEx(nx).eq.some(q=>['bar','man','hex'].includes(q))) return {kind:'cambiar',uid:it.uid,exId:it.exId,title:`Pasa a peso libre: ${getEx(nx).n}`,text:`Llevas ${h.length} sesiones progresando en ${name}. Ya puedes probar ${getEx(nx).n}; empieza con algo menos de peso.`,why:'Las máquinas y la Smith guían el recorrido y son ideales para aprender. El peso libre exige más estabilidad y suma músculos estabilizadores.',data:{to:nx}};
  }
  const kgUp = ex.mode==='p' && maxKg(h[0])>maxKg(h[h.length-1]);
  if (last>=first*1.02 || kgUp){
    const sets=setsFromSuggest(r,it);
    const w=sets.find(s=>s.t!=='c')||sets[0];
    const val = ex.mode==='p'?`${fmtKg(w.kg)} × ${w.reps}`: ex.mode==='t'?fmtTime(w.time):`${w.reps} reps`;
    return {progress:true,uid:it.uid,sets,line:`${name} ${val}`};
  }
  if (last<first && tired(h[0].chk)) return null; // vino cansado: no se cuenta en contra
  if (new Set(h.map(x=>phaseAt(x.date))).size>1) return null; // cambio de bloque: los números no son comparables
  if (last<=first*0.93){
    const sets=it.sets.map(s=>Object.assign({},s,{kg:s.kg?roundTo(s.kg*0.9,incFor(ex)):s.kg}));
    return {kind:'bajar',uid:it.uid,exId:it.exId,title:`${name}: bajemos un poco`,text:`Tu rendimiento bajó un ${Math.round((1-last/first)*100)} % en los últimos entrenos. Bajo la carga un 10 % para recuperar la técnica y la confianza.`,why:'Una caída sostenida suele indicar fatiga: revisa sueño, comida y estrés.',data:{sets},stagnant:true};
  }
  if (h.length>=4 && last<=prevMax*1.005){
    if (avgInt<=5 && it.sets.filter(s=>s.t!=='c').length<5)
      return {kind:'series',uid:it.uid,exId:it.exId,title:`${name}: una serie más`,text:`Te resulta cómodo (intensidad media ${avgInt.toFixed(1)}/10) pero no avanzas. Agrego una serie para dar más estímulo.`,why:'Aumentar el volumen es otra forma válida de progresar.',data:{add:1}};
    const alt=alternatives(it.exId, r.items.map(x=>x.exId))[0];
    if (alt) return {kind:'cambiar',uid:it.uid,exId:it.exId,title:`${name}: estancado`,text:`Sin mejoras en 4 entrenos. Propongo ${getEx(alt).n} para dar un estímulo nuevo al mismo músculo.`,why:'Variar el ejercicio ayuda a romper estancamientos.',data:{to:alt},stagnant:true};
  }
  return null;
}
function renewRoutine(r){
  const used=r.items.map(x=>x.exId).concat(r.prevEx||[]);
  let keep=0, change=0; const lines=[];
  const items=r.items.map(it=>{
    const ex=getEx(it.exId);
    if (it.warm||it.cool||ex.custom){ keep++; return Object.assign({},it,{uid:uid()}); }
    const h=exHistory(it.exId,6);
    let progressing=false;
    if (h.length>=2){ const a=sessionScore(h[h.length-1],ex), b=sessionScore(h[0],ex); progressing=(b-a)/(a||1)>=0.03; }
    const dislike=avoided(it.exId);
    if (progressing && !dislike){ keep++; lines.push(`${ex.n}: se mantiene (sigue progresando)`); const n=Object.assign({},it,{uid:uid()}); n.sets=setsFromSuggest(r,it); return n; }
    const alt=alternatives(it.exId, used)[0];
    if (!alt){ keep++; return Object.assign({},it,{uid:uid()}); }
    used.push(alt); change++; lines.push(`${ex.n} → ${getEx(alt).n}`);
    const n=Object.assign({},it,{uid:uid(),exId:alt});
    const aex=getEx(alt), rng=it.range||[10,12];
    const kg=aex.mode==='p'?estimateKg(alt,rng[0]):null;
    n.range = aex.mode==='t'?null:rng;
    n.sets=it.sets.map(s=>({t:s.t, kg, reps:aex.mode==='t'?null:rng[0], time:aex.mode==='t'?(s.time||30):null}));
    return n;
  });
  return {items, keep, change, lines};
}
function applySuggestion(r, s){
  const it=r.items.find(x=>x.uid===s.uid);
  switch(s.kind){
    case 'actualizar': (s.data.items||[]).forEach(u=>{ const x=r.items.find(i=>i.uid===u.uid); if(x) x.sets=u.sets; }); break;
    case 'bajar': if (it) it.sets=s.data.sets; break;
    case 'series': if (it){ const w=it.sets.filter(x=>x.t!=='c'); it.sets.push(Object.assign({},w[w.length-1]||{t:'n',reps:10})); } break;
    case 'cambiar': if (it){ const to=getEx(s.data.to), rng=it.range||[8,12]; it.exId=to.id; it.range=to.mode==='t'?null:rng; const kg=to.mode==='p'?estimateKg(to.id,rng[0]):null; it.sets=it.sets.map(x=>({t:x.t,kg,reps:to.mode==='t'?null:rng[0],time:to.mode==='t'?(x.time||30):null})); } break;
    case 'renovar': r.prevEx=r.items.map(x=>x.exId); r.items=s.data.items; break;
    case 'descarga': S.deload={start:Date.now(),until:Date.now()+7*DAY}; S.lastDeload=Date.now(); break;
  }
  r.sugg=r.sugg.filter(x=>x.id!==s.id);
  S.applied=(S.applied||0)+1;
}

/* ---------- Análisis semanal ---------- */
function muscleSets(days){
  const from=Date.now()-days*DAY, out={};
  S.sessions.filter(s=>s.end>=from).forEach(s=>s.items.forEach(it=>{
    const ex=getEx(it.exId); const n=it.sets.filter(x=>x.done&&x.t!=='c').length;
    ex.prim.forEach(m=>out[m]=(out[m]||0)+n);
    ex.sec.forEach(m=>out[m]=(out[m]||0)+n*0.5);
  }));
  return out;
}
function laggingMuscles(){
  const recent=S.sessions.filter(s=>s.end>=Date.now()-7*DAY);
  if (recent.length<2) return [];
  const ms=muscleSets(7);
  return ['pecho','dorsales','hombros','cuadriceps','isquios','gluteos','abdomen'].filter(m=>!(ms[m]>=2));
}
function recoveryWarning(r){
  const from=Date.now()-2*DAY, ms={};
  S.sessions.filter(s=>s.end>=from).forEach(s=>s.items.forEach(it=>{ const ex=getEx(it.exId); const n=it.sets.filter(x=>x.done&&x.t!=='c').length; ex.prim.forEach(m=>ms[m]=(ms[m]||0)+n); }));
  const mine=new Set(); r.items.forEach(it=>getEx(it.exId).prim.forEach(m=>mine.add(m)));
  return [...mine].filter(m=>ms[m]>=6 && !['cardio','movilidad'].includes(m));
}
function streakWeeks(){
  if (!S.sessions.length) return 0;
  const wk=new Set(S.sessions.map(s=>weekKey(s.end)));
  let k=weekKey(Date.now()), n=0;
  if (!wk.has(k)) k-=7*DAY;
  while (wk.has(k)){ n++; k-=7*DAY; }
  return n;
}
function records(){
  const rec={};
  S.sessions.forEach(s=>s.items.forEach(it=>{
    const ex=getEx(it.exId); const r=rec[it.exId]=rec[it.exId]||{kg:0,reps:0,vol:0,time:0,date:0};
    it.sets.filter(x=>x.done&&x.t!=='c').forEach(x=>{
      const kg=+x.kg||0, reps=+x.reps||0, t=+x.time||0;
      if (ex.mode==='p' && kg>r.kg){ r.kg=kg; r.kgReps=reps; r.date=s.end; }
      if (reps>r.reps && ex.mode!=='p'){ r.reps=reps; r.date=s.end; }
      if (kg*reps>r.vol) r.vol=kg*reps;
      if (t>r.time){ r.time=t; r.date=s.end; }
    });
  }));
  return rec;
}

/* ============ Figuras animadas de ejercicios ============
   Esqueleto 2D. Ángulos absolutos en grados: 0 = abajo, 90 = adelante (derecha), 180 = arriba, -90 = atrás.
   Pose: [torso, cabeza, brazoCerca, antebrazoCerca, brazoLejos, antebrazoLejos, musloCerca, piernaCerca, musloLejos, piernaLejos, {opciones}]
   Opciones: r (rotación del cuerpo), sh (subir hombros), fN/fF (ángulo del pie), an (ancla propia), lift (salto) */
const SEG={T:26,HD:9.5,HR:6.3,U:14.5,F:13.5,TH:19.5,SH:19,FT:5.5};
const dv=a=>{const r=a*Math.PI/180;return [Math.sin(r),Math.cos(r)];};
function fk(p, v){
  const o=p[10]||{}, P={};
  const add=(a,b,ang,len)=>{const d=dv(ang);return [a[0]+d[0]*len,a[1]+d[1]*len];};
  P.hip=[0,0];
  P.sho=add(P.hip,null,p[0],SEG.T);
  P.head=add(P.sho,null,p[0]+p[1],SEG.HD);
  let sN=P.sho, sF=P.sho, hN=P.hip, hF=P.hip;
  if (v==='front'){ const pd=dv(p[0]+90); sN=[P.sho[0]+pd[0]*7,P.sho[1]+pd[1]*7]; sF=[P.sho[0]-pd[0]*7,P.sho[1]-pd[1]*7]; hN=[pd[0]*4.5,pd[1]*4.5]; hF=[-pd[0]*4.5,-pd[1]*4.5]; }
  const sh=o.sh||0; sN=[sN[0],sN[1]-sh]; sF=[sF[0],sF[1]-sh];
  P.shoN=sN; P.shoF=sF; P.hipN=hN; P.hipF=hF;
  P.elbowN=add(sN,null,p[2],SEG.U); P.handN=add(P.elbowN,null,p[3],SEG.F);
  P.elbowF=add(sF,null,p[4],SEG.U); P.handF=add(P.elbowF,null,p[5],SEG.F);
  P.kneeN=add(hN,null,p[6],SEG.TH); P.ankleN=add(P.kneeN,null,p[7],SEG.SH);
  P.kneeF=add(hF,null,p[8],SEG.TH); P.ankleF=add(P.kneeF,null,p[9],SEG.SH);
  const fa = v==='front'?null:1;
  if (fa){ P.toeN=add(P.ankleN,null,o.fN??90,SEG.FT); P.toeF=add(P.ankleF,null,o.fF??90,SEG.FT); }
  return P;
}
function rotP(P, deg){ if(!deg) return P; const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r); const Q={}; for(const k in P){ const [x,y]=P[k]; Q[k]=[x*c-y*s, x*s+y*c]; } return Q; }
function placeP(P, an, lift){ const a=P[an[0]]||P.ankleN; const dx=an[1]-a[0], dy=an[2]-a[1]-(lift||0); const Q={}; for(const k in P) Q[k]=[P[k][0]+dx,P[k][1]+dy]; return Q; }
function solveRot(p, tpl, an){
  const c=tpl.c; if(!c) return 0;
  let best=0, bd=1e9; const lo=c.lo??-90, hi=c.hi??90;
  for (let r=lo;r<=hi;r+=1){
    const Q=placeP(rotP(fk(p,tpl.v),r),an,0); const q=Q[c.pt]; if(!q) break;
    const d=(c.y!=null?Math.abs(q[1]-c.y):0)+(c.x!=null?Math.abs(q[0]-c.x):0);
    if (d<bd){ bd=d; best=r; }
  }
  return best;
}
function posePoints(tpl, p){
  const o=p[10]||{}; const an=o.an||tpl.an||['ankleN',50,90];
  const r=(o.r!=null?o.r:0) + (o._solved||0);
  return placeP(rotP(fk(p,tpl.v),r),an,o.lift);
}
function prepTpl(tpl){
  if (tpl._ok) return tpl;
  tpl.k=tpl.k.map(p=>{ const q=p.slice(); q[10]=Object.assign({},p[10]||{}); if(tpl.c && q[10].r==null){ const an=q[10].an||tpl.an||['ankleN',50,90]; q[10]._solved=solveRot(q,tpl,an); } return q; });
  tpl._ok=true; return tpl;
}
function lerpPose(a,b,t){
  const q=[]; for(let i=0;i<10;i++){ let d=b[i]-a[i]; while(d>180)d-=360; while(d<-180)d+=360; q[i]=a[i]+d*t; }
  const oa=a[10]||{}, ob=b[10]||{}, o={};
  ['r','sh','fN','fF','lift','_solved'].forEach(k=>{ const x=oa[k]??(k==='fN'||k==='fF'?90:0), y=ob[k]??(k==='fN'||k==='fF'?90:0); o[k]=x+(y-x)*t; });
  if (oa.r==null&&ob.r==null) delete o.r;
  const anA=oa.an, anB=ob.an;
  if (anA||anB){ const A=anA||null, B=anB||null; if(A&&B&&A[0]===B[0]) o.an=[A[0],A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t]; else o.an=t<0.5?A:B; if(!o.an) delete o.an; }
  q[10]=o; return q;
}

const f1=n=>Math.round(n*10)/10;

function drawProps(t, P){

    if (k==='ln') s+=LN([a[0],a[1]],[a[2],a[3]],3,.55);

    else if (k==='par'){ s+=LN([a[0]-20,a[1]],[a[0]+16,a[1]],3.5,.65)+LN([a[0],a[1]],[a[0],92],2.5,.35); }

let animRAF=null;
function animLoop(ts){
  const els=document.querySelectorAll('[data-anim]');
  if (!els.length){ animRAF=null; return; }
  els.forEach(el=>{
    const ex=getEx(el.dataset.anim); if(ex.custom) return;
    const t=tplFor(ex); const n=t.k.length;
    if (n<2 && !t.hold) return;
    let pose;
    if (n<2){ const b=(Math.sin(ts/650)+1)/2; pose=t.k[0].slice(); pose[0]+= b*1.5; }
    else {
      const seq = n===2 ? [0,1] : [...Array(n).keys()];
      const segs = n===2 ? 2 : n;
      const segT = 1050, hold=320, cyc=segs*(segT+hold);
      const tt=(ts % cyc); const si=Math.floor(tt/(segT+hold)); const lt=tt-si*(segT+hold);
      let a,b; if (n===2){ a=si===0?0:1; b=si===0?1:0; } else { a=seq[si]; b=seq[(si+1)%n]; }
      let u=Math.max(0,Math.min(1,(lt-hold)/segT)); u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      pose=lerpPose(t.k[a],t.k[b],u);
    }
    el.innerHTML=figWrap(figureSVG(ex,pose,t));
  });
  animRAF=requestAnimationFrame(animLoop);
}

function setsSummary(it){
  const ex=getEx(it.exId), w=it.sets.filter(s=>s.t!=='c'), c=it.sets.length-w.length;
  if (!w.length) return 'Sin series';
  let s;
  if (ex.mode==='t') s=`${w.length} × ${fmtTime(w[0].time||30)}`;
  else { const rng=it.range&&it.range[0]!==it.range[1]?`${it.range[0]}–${it.range[1]}`:(w[0].reps||'—'); s=`${w.length} × ${rng}`; }
  if (ex.mode==='p' && w[0].kg) s+=` · ${fmtKg(w[0].kg)}`;
  if (c) s+=` · ${c} calent.`;
  return s;
}
function exRow(it, act, v, right){

const PK_ORDER=MUSCLE_GROUPS.map(x=>x[0]).concat(['movilidad']);
function pkList(p){
  const q=(p.q||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let list=Object.values(EX).filter(e=>{
    if (p.m && !e.prim.includes(p.m) && !(p.m==='cardio'&&e.pat==='cardio')) return false;
    if (p.mine && !hasEquip(e)) return false;
    if (p.et && EQ_TEST[p.et] && !EQ_TEST[p.et](e)) return false;
    if (q){ const hay=(e.n+' '+(EX_ALIAS[e.id]||'')+' '+e.prim.map(m=>MUSCLES[m]).join(' ')+' '+e.eq.map(x=>EQUIP[x]).join(' ')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); if(!q.split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false; }
    return true;
  }).sort((a,b)=>a.n.localeCompare(b.n,'es'));
  let h='';
  if (p.mode==='replace' && !q && !p.m){
    const alts=alternatives(p.from).slice(0,6);
    if (alts.length){ h+=`<div class="sec">Recomendados por PandarIA</div>`; alts.forEach(id=>h+=pkRow(getEx(id),p)); h+=`<div class="sec">Todos</div>`; }
  }
  if (!list.length) h+=`<div class="empty">No hay ejercicios con esos filtros.<br><button class="link" data-a="pkCreate" style="margin-top:10px">Crear ejercicio propio</button></div>`;
  if (!q && !p.m && list.length>12){
    // clasificado por músculo para buscar más fácil
    const by={}; list.forEach(e=>{ const m=e.pat==='cardio'?'cardio':['yoga','estiramiento','movilidad','pilates'].includes(e.pat)?'movilidad':e.prim[0]; (by[m]=by[m]||[]).push(e); });
    PK_ORDER.forEach(m=>{ if(!by[m]) return; h+=`<div class="sec">${esc(m==='movilidad'?'Movilidad y estiramientos':(MUSCLE_GROUPS.find(x=>x[0]===m)||[0,MUSCLES[m]])[1])} <span class="mut" style="font-weight:500">· ${by[m].length}</span></div>`; by[m].forEach(e=>h+=pkRow(e,p)); delete by[m]; });
    Object.values(by).forEach(arr=>arr.forEach(e=>h+=pkRow(e,p)));
  } else list.forEach(e=>h+=pkRow(e,p));
  return h;
}
function pkRow(e,p){
  const on=(p.sel||[]).includes(e.id);
  const right = p.mode==='add'||p.mode==='wadd' ? `<span class="check ${on?'on':''}">${on?I('check',16):''}</span>` : I('right',18);
  const av=(S.settings.avoid||{})[e.id];

}

  b+=`<div class="sec">Preferencias</div><div class="row" style="gap:8px"><button class="btn grow ${av==='no'?'danger':''}" data-a="avoidEx" data-v="${ex.id}|no">${I('eyeoff',18)} No me gusta</button><button class="btn grow ${av==='molesta'?'danger':''}" data-a="avoidEx" data-v="${ex.id}|molesta">${I('alert',18)} Me molesta</button></div>

  return lhdr(ex.n)+`<div class="lbody">${b}</div>`;
};

let wakeLock=null;
async function keepAwake(){ try{ if (S.settings.awake!==false && navigator.wakeLock && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>wakeLock=null); } }catch(e){} }
function releaseAwake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S && S.active) keepAwake(); });

function activeItemFrom(tplItem, r){
  const it=clone(tplItem);
  it.sets=tplItem.sets.map((s,i)=>{
    const g=suggestSet(r,tplItem,i);
    return {t:s.t||'n', kg:null, reps:null, time:null, done:false, sk:g.kg, sr:g.reps, st:g.time, why:g.why, tk:s.kg, tr:s.reps, tt:s.time};
  });
  it.note='';
  return it;
}
A.startWorkout=rid=>{
  const r=findR(rid);
  if (!r.items.length){ toast('Añade ejercicios a la rutina primero'); return; }
  const go=()=>{
    const rec=records(); const snap={}; r.items.forEach(i=>{ if(rec[i.exId]) snap[i.exId]=Object.assign({},rec[i.exId]); });
    S.active={routineId:r.id, name:r.name, start:Date.now(), items:r.items.map(it=>activeItemFrom(it,r)), rest:null, rec:snap, intensity:6};
    save(true); openLayer('workout'); keepAwake();
    const ld=lastTrainedDays(); if (ld!==null && ld>=14 && r.pandaria) toast(`Volviste tras ${Math.round(ld)} días: PandarIA ajustó los pesos`);
    speak(`Empezamos ${r.name}. Primer ejercicio: ${getEx(r.items[0].exId).n}`);
  };
  if (S.active){
    if (S.active.routineId===rid){ openLayer('workout'); return; }
    confirmBox({title:'Ya tienes un entreno en curso',text:`Estás entrenando <b>${esc(S.active.name)}</b>. ¿Qué quieres hacer?`,okText:'Volver al entreno actual',ok:()=>openLayer('workout'),noText:'Descartarlo y empezar este',no:go});
    return;
  }
  go();
};

  for (const it of S.active.items){ const i=it.sets.findIndex(s=>!s.done); if(i>=0) return {it,i}; }
  return null;
}

  const r=S.active.rest; const left=Math.max(0,(r.end-Date.now())/1000);
  return `<div class="restbar" id="rb"><div class="fill" style="width:${(left/r.total*100).toFixed(1)}%"></div><button data-a="wkRestAdj" data-v="-15">−15</button><span class="t" id="rbt">${fmtTime(left)}</span><button data-a="wkRestAdj" data-v="15">+15</button><button data-a="wkRestAdj" data-v="skip">Saltar</button></div>`;

SCREENS.workout = () => {
  const a=S.active;
  if (!a) return lhdr('Entreno')+'<div class="empty">No hay entreno en curso.</div>';
  const r=findR(a.routineId);
  let b=`<div style="padding:4px 0 10px"><div style="font-size:22px;font-weight:800">${esc(a.name)}</div><div class="xs mut" style="margin-top:4px">${fmtDateL(a.start)}${r&&r.pandaria?` · <span style="color:var(--ac)">PandarIA sugiere en gris</span>`:''}</div></div>`;
  if (deloadActive()) b+=`<div class="banner blue"><span class="ic">${I('refresh',20)}</span><div class="grow sm">Semana de descarga: pesos un 15 % más livianos y concéntrate en la técnica.</div></div>`;
  if (a.rest && !a.rest.uid) b+=restBarHtml();
  let prevSup=null;
  a.items.forEach((it,idx)=>{
    const ex=getEx(it.exId), mode=ex.mode;
    const nextSame = it.superset && a.items[idx+1] && a.items[idx+1].superset===it.superset;
    const inSup = it.superset && (nextSame || prevSup===it.superset);
    b+=`<div class="wk-ex"><div class="${inSup?'ssup':''}">${inSup&&prevSup!==it.superset?'<div class="suptag">SUPERSERIE</div>':''}
      <div class="exh"><button data-a="wkPeek" data-v="${it.exId}">${exIcon(ex)}</button><button class="exn" style="text-align:left" data-a="openEx" data-v="${it.exId}">${esc(ex.n)}</button>
      <button class="ibtn soft" style="color:var(--blue)" data-a="openEx" data-v="${it.exId}">${I('chart',20)}</button><button class="ibtn" style="color:var(--blue)" data-a="wkMenu" data-v="${it.uid}">${I('more',24)}</button></div>
      ${it.sticky?`<div class="note sticky">${I('pin',13).replace('<svg','<svg style="display:inline;vertical-align:-2px"')} ${esc(it.sticky)}</div>`:''}
      ${it.note?`<div class="note">${I('note',13).replace('<svg','<svg style="display:inline;vertical-align:-2px"')} ${esc(it.note)}</div>`:''}
      <div class="sgrid ${mode!=='p'?'nokg':''} shead"><div>SERIE</div><div>ANTERIOR</div>${mode==='p'?`<div>${S.settings.unit.toUpperCase()}</div>`:''}<div>${mode==='t'?'SEG':'REPS'}</div><div>${I('check',16).replace('<svg','<svg style="margin:0 auto"')}</div></div>`;
    let wn=0, stepDone=false;
    it.sets.forEach((s,i)=>{
      if (s.t!=='c') wn++;
      const lbl=s.t==='c'?'C':s.t==='f'?'F':s.t==='d'?'D':wn;
      const prev=prevText(it.exId, Math.max(0,wn-1), mode);
      b+=`<div class="sgrid srw ${mode!=='p'?'nokg':''} ${s.done?'done':''}" id="sr-${it.uid}-${i}">
        <button class="snum ${s.t}" data-a="wkSetType" data-v="${it.uid}|${i}">${lbl}</button>
        <div class="sprev">${s.t==='c'?'<span style="color:var(--gold)">Calent.</span>':(prev||'—')}${s.pr?' <span style="color:var(--gold)">★</span>':''}</div>
        ${mode==='p'?`<input class="sinp" type="number" inputmode="decimal" step="any" value="${toUnit(s.kg)}" placeholder="${toUnit(s.sk)}" data-in="wk" data-u="${it.uid}" data-i="${i}" data-f="kg">`:''}
        ${mode==='t'?`<input class="sinp" type="number" inputmode="numeric" value="${s.time??''}" placeholder="${s.st??''}" data-in="wk" data-u="${it.uid}" data-i="${i}" data-f="time">`
          :`<input class="sinp" type="number" inputmode="numeric" value="${s.reps??''}" placeholder="${s.sr??''}" data-in="wk" data-u="${it.uid}" data-i="${i}" data-f="reps">`}
        ${mode==='t'&&!s.done?`<button class="sck play" data-a="wkPlay" data-v="${it.uid}|${i}">${I('play',18)}</button>`:`<button class="sck" data-a="wkCheck" data-v="${it.uid}|${i}">${I('check',22)}</button>`}</div>`;
      const tm=a.timer && a.timer.uid===it.uid && a.timer.i===i;
      if (tm) b+=timerBarHtml();
      else if (!s.done && !stepDone){ stepDone=true; b+=stepRowHtml(it,i,mode); }
      if (s.done && S.settings.rir && s.t!=='c') b+=rirHtml(it,i,s);
      const isActiveRest = a.rest && a.rest.uid===it.uid && a.rest.i===i;
      if (isActiveRest) b+=restBarHtml();
      else if (nextSame) { if(i<it.sets.length-1) b+=`<div class="xs" style="text-align:center;color:var(--ac);padding:3px 0">→ alterna con el siguiente ejercicio</div>`; }
      else if (it.rest>0) b+=restLineHtml(it,i,s.done);
    });
    b+=`<div style="text-align:center;padding:10px 0 8px"><button class="link" data-a="wkAddSet" data-v="${it.uid}">AÑADIR SERIE (${fmtTime(it.rest)})</button></div>
      ${s0why(it)}</div></div>`;
    prevSup=it.superset;
  });
  b+=`<button class="btn wide" style="margin:18px 0 12px" data-a="wkAddEx">${I('plus',20)} Añadir ejercicios</button>
    <button class="btn ok big" data-a="wkFinish">${I('check',22)} Terminar rutina</button>
    <button class="btn ghost wide" style="margin-top:8px;color:var(--bad)" data-a="wkDiscard">Descartar entreno</button>`;
  return `<div class="wk-top"><button class="ibtn" data-a="wkMin">${I('down',26)}</button><button class="ibtn soft" data-a="wkTimer">${I('timer',22)}</button>
    <span class="clock tick-clock">${fmtTime((Date.now()-a.start)/1000)}</span><button class="link" style="padding:0 6px;font-size:15px" data-a="wkFinish">TERMINAR</button></div>
    <div class="lbody" style="padding-top:8px">${b}</div>`;
};
function stepRowHtml(it,i,mode){
  const B=(f,d,l)=>`<button class="stb" data-a="wkStep" data-v="${it.uid}|${i}|${f}|${d}">${l}</button>`;
  const ex=getEx(it.exId); const inc=fmtNum(toUnit(incFor(ex)));
  return `<div class="sgrid stprow ${mode!=='p'?'nokg':''}"><div></div><div class="xs mut" style="text-align:right;padding-right:4px">Ajustar</div>
    ${mode==='p'?`<div class="stp2">${B('kg',-1,'−')}${B('kg',1,'+')}</div>`:''}
    <div class="stp2">${mode==='t'?B('time',-1,'−')+B('time',1,'+'):B('reps',-1,'−')+B('reps',1,'+')}</div><div></div></div>`;
}
function rirHtml(it,i,s){
  return `<div class="rirrow"><span class="xs mut">¿Cuántas te quedaban?</span>${[0,1,2,3,4].map(n=>`<button class="rirb ${s.rir===n?'on':''}" data-a="wkRir" data-v="${it.uid}|${i}|${n}">${n===4?'4+':n}</button>`).join('')}</div>`;
}
function timerBarHtml(){
  const t=S.active.timer; const left=Math.max(0,(t.end-Date.now())/1000);
  return `<div class="restbar tbar" id="tb"><div class="fill" style="width:${(left/t.total*100).toFixed(1)}%"></div><button data-a="wkTimerStop" data-v="cancel">${I('x',18)}</button><span class="t" id="tbt">${fmtTime(Math.ceil(left))}</span><button data-a="wkTimerStop" data-v="done" style="width:70px">Hecho</button></div>`;
}
A.wkStep=v=>{
  const [u,i,f,d]=v.split('|'); const it=wkItem(u), s=it.sets[+i], ex=getEx(it.exId);
  const row=document.getElementById(`sr-${u}-${i}`); const inp=row&&row.querySelector(`input[data-f="${f}"]`);
  let cur = s[f]!=null ? s[f] : (f==='kg'?(s.sk??s.tk):f==='reps'?(s.sr??s.tr):(s.st??s.tt));
  cur=+cur||0;
  const step = f==='kg'?incFor(ex):f==='time'?5:1;
  let nv=Math.max(0, cur+step*(+d)); if (f==='kg') nv=Math.round(nv*100)/100;
  s[f]=nv; if (inp) inp.value = f==='kg'?toUnit(nv):nv;
  vibrate(10); save();
};
A.wkRir=v=>{ const [u,i,n]=v.split('|'); const s=wkItem(u).sets[+i]; s.rir = s.rir===+n?null:+n; save(); refreshTop(); };
A.wkPeek=id=>{
  const ex=getEx(id); const P=PATTERNS[ex.pat]||PATTERNS.core;
  openModal(`<div class="sheet"><div class="grab"></div><div style="max-width:240px;margin:0 auto">${exAnim(ex)}</div>
    <h3 style="text-align:center;margin:14px 0 6px">${esc(ex.n)}</h3>${ex.tip?`<p class="sm mut" style="text-align:center;line-height:1.45;margin:0 8px 12px">${esc(ex.tip)}</p>`:''}
    ${ex.custom?'':`<div class="card">${P.steps.slice(0,3).map((s,k)=>`<div class="row sm" style="align-items:flex-start;padding:4px 0"><span class="tag ac">${k+1}</span><span style="line-height:1.4">${esc(s)}</span></div>`).join('')}</div>`}
    <div class="row" style="gap:8px"><button class="btn grow" data-a="closeModal">Cerrar</button><button class="btn pri grow" data-a="cbm" data-v="${cb(()=>A.openEx(id))}">Ver ficha completa</button></div></div>`);
};
A.wkPlay=v=>{
  const [u,i]=v.split('|'); const it=wkItem(u), s=it.sets[+i];
  const row=document.getElementById(`sr-${u}-${i}`); const inp=row&&row.querySelector('input'); if(inp&&inp.value!=='') s.time=+inp.value;
  const secs=+(s.time??s.st??s.tt??30)||30;
  S.active.rest=null; closeRestOv();
  S.active.timer={uid:u,i:+i,end:Date.now()+secs*1000+3000,total:secs+3,secs,pre:3};
  speak(getEx(it.exId).n); save(); refreshTop();
};
A.wkTimerStop=v=>{
  const t=S.active.timer; if(!t) return; S.active.timer=null;
  if (v==='done'){ const it=wkItem(t.uid); const s=it.sets[t.i]; const el=Math.round(t.secs-(Math.max(0,(t.end-Date.now())/1000))); s.time=Math.max(1,Math.min(t.secs,el)); completeSet(t.uid,t.i); return; }
  save(); refreshTop();
};
function s0why(it){
  const s=it.sets.find(x=>x.t!=='c'&&!x.done);
  if (!s||!s.why) return '';
  return `<div class="xs" style="color:var(--mut);display:flex;gap:6px;align-items:center;justify-content:center;padding-bottom:6px"><span style="color:var(--ac)">${I('spark',13)}</span>${esc(s.why)}</div>`;
}
IN.wk=el=>{
  const it=wkItem(el.dataset.u); if(!it) return; const s=it.sets[+el.dataset.i]; const f=el.dataset.f;
  s[f]= f==='kg'?fromUnit(el.value):(el.value===''?null:+el.value);
  save();
};
A.wkMin=()=>{ closeRestOv(); closeLayer(); };
A.wkCheck=v=>{
  const [u,i]=v.split('|'); const s=wkItem(u).sets[+i];
  if (s.done){ s.done=false; if(S.active.rest&&S.active.rest.uid===u&&S.active.rest.i===+i){ S.active.rest=null; closeRestOv(); } save(); refreshTop(); return; }
  completeSet(u,+i);
};
function completeSet(u,i){
  const it=wkItem(u), s=it.sets[+i], ex=getEx(it.exId);
  // completar con lo escrito o con la sugerencia
  const row=document.getElementById(`sr-${u}-${i}`);
  if (row) row.querySelectorAll('input').forEach(inp=>{ if(inp.value!=='') { const f=inp.dataset.f; s[f]=f==='kg'?fromUnit(inp.value):+inp.value; } });
  if (ex.mode==='p'){ if (s.kg==null) s.kg=s.sk??s.tk??null; if (s.reps==null) s.reps=s.sr??s.tr??null;
    if (s.reps==null||s.reps<=0){ toast('Escribe las repeticiones'); return; } if (s.kg==null) s.kg=0; }
  else if (ex.mode==='r'){ if (s.reps==null) s.reps=s.sr??s.tr; if(!s.reps){ toast('Escribe las repeticiones'); return; } }
  else { if (s.time==null) s.time=s.st??s.tt; if(!s.time){ toast('Escribe los segundos'); return; } }
  s.done=true;
  vibrate(30);
  // lo que hiciste pasa a ser la referencia de las series siguientes
  if (s.t!=='c') it.sets.slice(+i+1).forEach(n=>{ if(n.done||n.t==='c') return; if(ex.mode==='p'&&n.kg==null&&s.kg!=null) n.sk=s.kg; if(ex.mode==='t'&&n.time==null&&s.time) n.st=s.time; });
  // récord personal
  if (s.t!=='c'){
    const rec=S.active.rec[it.exId];
    if (rec){
      let pr=false;
      if (ex.mode==='p' && rec.kg>0 && s.kg>rec.kg){ pr=true; rec.kg=s.kg; }
      else if (ex.mode==='r' && rec.reps>0 && s.reps>rec.reps){ pr=true; rec.reps=s.reps; }
      else if (ex.mode==='t' && rec.time>0 && s.time>rec.time){ pr=true; rec.time=s.time; }
      if (pr){ s.pr=true; toast(`★ ¡Nuevo récord en ${esc(ex.n)}!`,'pr'); vibrate([60,40,60,40,120]); }
    } else S.active.rec[it.exId]={kg:+s.kg||0,reps:+s.reps||0,time:+s.time||0};
  }
  // descanso
  const idx=S.active.items.indexOf(it);
  const nextSame = it.superset && S.active.items[idx+1] && S.active.items[idx+1].superset===it.superset;
  if (nextSame){ toast(`Sigue: ${esc(getEx(S.active.items[idx+1].exId).n)}`); S.active.rest=null; }
  else {
    let rest=+it.rest||0;
    // en superserie, tras el último ejercicio vuelve al primero del grupo
    if (rest>0 && nextPending()){ S.active.rest={uid:u,i:+i,end:Date.now()+rest*1000,total:rest}; if (S.settings.bigRest) openRestOv(); }
  }
  if (!nextPending()) toast('¡Completaste todas las series! Toca Terminar rutina.');
  save(); refreshTop();
}
A.wkRestAdj=v=>{
  const r=S.active&&S.active.rest; if(!r) return;
  if (v==='skip'){ S.active.rest=null; closeRestOv(); save(); refreshTop(); return; }
  r.end+= (+v)*1000; r.total=Math.max(r.total+(+v),1); if (r.end<Date.now()){ S.active.rest=null; closeRestOv(); } save(); refreshTop(); updRestOv();
};
A.wkRestEdit=u=>{ const it=wkItem(u); sheet('Descanso de este ejercicio',[0,15,30,45,60,75,90,120,150,180,240,300].map(s=>({icon:'timer',label:(s?fmtTime(s):'Sin descanso')+(it.rest===s?'  ✓':''),fn:()=>{it.rest=s;save();refreshTop();}}))); };
A.wkTimer=()=>{
  const r=S.active.rest;
  const items = r ? [{icon:'x',label:'Saltar descanso',fn:()=>A.wkRestAdj('skip')},{icon:'plus',label:'Añadir 30 segundos',fn:()=>A.wkRestAdj('30')}] : [];
  sheet('Temporizador de descanso', items.concat([30,60,90,120,180,300].map(s=>({icon:'timer',label:`Iniciar descanso de ${fmtTime(s)}`,fn:()=>{ S.active.rest={uid:null,i:-1,end:Date.now()+s*1000,total:s}; save(); refreshTop(); }}))));
};
A.wkAddSet=u=>{
  const it=wkItem(u); const l=it.sets.filter(x=>x.t!=='c').slice(-1)[0]||it.sets[it.sets.length-1];
  it.sets.push(l?{t:'n',kg:null,reps:null,time:null,done:false,sk:l.kg??l.sk,sr:l.reps??l.sr,st:l.time??l.st,tk:l.tk,tr:l.tr,tt:l.tt}:{t:'n',kg:null,reps:null,time:null,done:false,sr:10});
  save(); refreshTop();
};
A.wkSetType=v=>{
  const [u,i]=v.split('|'); const it=wkItem(u), s=it.sets[+i];
  sheet('Tipo de serie',[['n','Normal'],['c','Calentamiento'],['f','Al fallo'],['d','Drop set']].map(([t,l])=>({icon:'list',label:l+(s.t===t?'  ✓':''),fn:()=>{s.t=t;save();refreshTop();}})).concat([{icon:'trash',label:'Eliminar serie',danger:true,fn:()=>{ it.sets.splice(+i,1); if(S.active.rest&&S.active.rest.uid===u) S.active.rest=null; save(); refreshTop(); }}]));

A.wkMenu=u=>{

  const opts=[
    {icon:'note',label:it.note?'Editar nota':'Añadir nota',fn:()=>promptBox({title:'Nota de hoy',value:it.note,area:true,ph:'Ej.: me costó la última serie',ok:v=>{it.note=v.trim();save();refreshTop();}})},
    {icon:'pin',label:it.sticky?'Editar nota fija':'Añadir nota fija',fn:()=>promptBox({title:'Nota fija',text:'Se guardará en la rutina y aparecerá siempre.',value:it.sticky,area:true,ok:v=>{ it.sticky=v.trim(); const r=findR(S.active.routineId); const ri=r&&r.items.find(x=>x.uid===it.uid); if(ri) ri.sticky=it.sticky; save(); refreshTop(); }})},
    {icon:'flame',label:'Añadir series de calentamiento',fn:()=>{
      if (ex.mode!=='p'){ toast('Solo para ejercicios con peso'); return; }
      const w=it.sets.find(s=>s.t!=='c'); const kg=w&&(w.kg??w.sk);
      [[0.5,10],[0.7,5],[0.85,3]].reverse().forEach(([f,rp])=>it.sets.unshift({t:'c',kg:null,reps:null,time:null,done:false,sk:kg?roundTo(kg*f,incFor(ex)):null,sr:rp,why:'Serie de calentamiento'}));
      save(); refreshTop(); }},
    {icon:'timer',label:`Actualizar temporizador (${fmtTime(it.rest)})`,fn:()=>A.wkRestEdit(u)},
    {icon:'swap',label:'Reemplazar ejercicio',fn:()=>openLayer('picker',{mode:'replace',from:it.exId,q:'',m:'',mine:true,onPick:id=>{
      const r=findR(S.active.routineId)||{pandaria:true}; const nb=buildItem(id,r.goal||'musculo',userLevel());
      nb.sets=it.sets.filter(s=>s.t!=='c').map(()=>Object.assign({},nb.sets[0])); if(!nb.sets.length) nb.sets=[buildItem(id,'musculo',1).sets[0]];
      const na=activeItemFrom(nb,r); na.uid=it.uid; na.rest=it.rest; na.superset=it.superset; na.sticky='';
      S.active.items[S.active.items.indexOf(it)]=na; if(!S.active.rec[id]){ const rc=records()[id]; if(rc) S.active.rec[id]=rc; } save(); }})},
    it.superset?{icon:'link',label:'Quitar de la superserie',fn:()=>{ const g=it.superset; it.superset=null; const left=S.active.items.filter(x=>x.superset===g); if(left.length<2) left.forEach(x=>x.superset=null); save(); refreshTop(); }}
      :{icon:'link',label:'Crear superserie con el siguiente',fn:()=>{ const n=S.active.items[idx+1]; if(!n){toast('Añade otro ejercicio debajo');return;} const g=n.superset||uid(); it.superset=g; n.superset=g; save(); refreshTop(); }},
  ];
  if (['bar','smi','hex'].some(q=>ex.eq.includes(q))) opts.push({icon:'calc',label:'Calculadora de discos',fn:()=>{ const w=it.sets.find(s=>s.t!=='c'&&!s.done)||it.sets[0]; plateCalc(w.kg??w.sk); }});
  opts.push({icon:'settings',label:'Preferencias del ejercicio',fn:()=>sheet(ex.n,[
    {icon:'eyeoff',label:'No me gusta este ejercicio',fn:()=>{ S.settings.avoid[ex.id]='no'; save(); toast('PandarIA lo evitará en nuevas rutinas'); }},
    {icon:'alert',label:'Me molesta (dolor o incomodidad)',fn:()=>{ S.settings.avoid[ex.id]='molesta'; save(); toast('PandarIA te propondrá un cambio al terminar'); }},
    {icon:'info',label:'Ver ficha y técnica',fn:()=>A.openEx(ex.id)}])});
  opts.push({icon:'trash',label:'Eliminar ejercicio',danger:true,fn:()=>{ S.active.items.splice(idx,1); if(S.active.rest&&S.active.rest.uid===u) S.active.rest=null; save(); refreshTop(); }});
  sheet(ex.n,opts);

/* ---------- Pantalla de descanso grande ---------- */
function openRestOv(){
  if (!S.active||!S.active.rest) return;
  let ov=document.getElementById('restov');
  if (!ov){ ov=document.createElement('div'); ov.id='restov'; document.body.appendChild(ov); }
  const np=nextPending(); let nx='';
  if (np){ const ex=getEx(np.it.exId); const s=np.it.sets[np.i]; const wn=np.it.sets.slice(0,np.i+1).filter(x=>x.t!=='c').length, tot=np.it.sets.filter(x=>x.t!=='c').length;
    const tgt = ex.mode==='p'?`${fmtKg(s.kg??s.sk)} × ${s.reps??s.sr??'—'}`:ex.mode==='t'?fmtTime(s.time??s.st):`${s.reps??s.sr??'—'} reps`;

function plateCalc(kg){
  const st={kg:kg||60, bar:S.settings.barKg||20};
  const draw=()=>{
    const plates=[25,20,15,10,5,2.5,1.25,0.5].filter(p=>p>=Math.min(S.settings.minPlate,1.25)||p>=S.settings.minPlate);
    let side=(st.kg-st.bar)/2; const used=[];
    plates.forEach(p=>{ while(side>=p-1e-9){ used.push(p); side-=p; } });
    const col={25:'#e53935',20:'#1e63d6',15:'#f2b705',10:'#2e9e44',5:'#e8e8e8',2.5:'#333',1.25:'#888',0.5:'#bbb'};
    const vis=used.map(p=>`<div class="p" style="background:${col[p]};height:${40+p*3}px;width:${p>=10?16:11}px;${p===5||p===0.5?'color:#222':''}">${p}</div>`).join('');
    return `<div class="modal"><h3>Calculadora de discos</h3><p class="mut sm" style="margin-top:0">Discos para cada lado de la barra.</p>
      <div class="row" style="gap:8px"><input id="pcw" class="inp" type="number" inputmode="decimal" value="${st.kg}" style="flex:1"><span class="b">kg</span></div>
      <div class="seg" style="margin-top:10px">${[20,15,10].map(b=>`<button class="${st.bar===b?'on':''}" data-a="pcBar" data-v="${b}">Barra ${b} kg</button>`).join('')}</div>
      <div class="plates">${vis.split('').length?`<div class="row" style="gap:3px;flex-direction:row-reverse">${vis}</div><div class="bar"></div>`:''}</div>
      <div style="text-align:center" class="b">${used.length?`Cada lado: ${used.join(' + ')} kg`:st.kg<=st.bar?'Solo la barra':'—'}</div>
      ${side>0.01?`<div class="xs mut" style="text-align:center;margin-top:4px">Faltan ${fmtNum(side*2)} kg para el peso exacto</div>`:''}
      <div class="row" style="gap:8px;margin-top:16px"><button class="btn grow" data-a="closeModal">Cerrar</button><button class="btn pri grow" data-a="pcCalc">Calcular</button></div></div>`;
  };
  A.pcCalc=()=>{ st.kg=+$('#pcw').value||st.bar; MODALS[MODALS.length-1].html=draw(); renderModals(); };
  A.pcBar=v=>{ st.kg=+$('#pcw').value||st.kg; st.bar=+v; S.settings.barKg=+v; save(); MODALS[MODALS.length-1].html=draw(); renderModals(); };
  openModal(draw(),{center:true});
}

function tick(){
  if (!S || !S.active) return;
  const el=document.querySelectorAll('.tick-clock'); const t=fmtTime((Date.now()-S.active.start)/1000);
  el.forEach(e=>e.textContent=t);
  const tm=S.active.timer;
  if (tm){
    const left=(tm.end-Date.now())/1000, run=left<=tm.secs;
    const tb=document.getElementById('tb');
    if (tb){ const tt=document.getElementById('tbt'); if(tt) tt.textContent= run?fmtTime(Math.ceil(left)):`Prepárate ${Math.ceil(left-tm.secs)}`; tb.querySelector('.fill').style.width=(run?left/tm.secs*100:100).toFixed(1)+'%'; tb.classList.toggle('pre',!run); }
    const sec=Math.ceil(left); if (sec!==tm.last){ tm.last=sec; if ((sec<=3&&sec>0) || (sec-tm.secs<=3 && sec-tm.secs>0)) shortBeep(); if (sec===tm.secs) { shortBeep(1); speak('¡Ya!'); } }
    if (left<=0){ S.active.timer=null; beep(); vibrate([200,80,200]); const it=wkItem(tm.uid); if(it){ it.sets[tm.i].time=tm.secs; completeSet(tm.uid,tm.i); } }
  }
  const r=S.active.rest; if (!r) return;
  updRestOv();
  const left=(r.end-Date.now())/1000;
  const rb=document.getElementById('rb');
  if (left<=0){
    S.active.rest=null; save(); closeRestOv();
    beep(); vibrate([300,120,300]);
    const np=nextPending();
    speak(np?`Descanso terminado. Siguiente: ${getEx(np.it.exId).n}`:'Descanso terminado');
    if (rb){ const it=r.uid&&wkItem(r.uid); rb.outerHTML = it ? restLineHtml(it,r.i,true) : ''; }
    if (!LAYERS.some(l=>l.t==='workout')) toast('⏱️ ¡Descanso terminado!');
    return;
  }
  if (rb){ rb.querySelector('.fill').style.width=(left/r.total*100).toFixed(1)+'%'; const tt=document.getElementById('rbt'); if(tt) tt.textContent=fmtTime(left); }
}

function shortBeep(hi){
  if (!S.settings.sound) return;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=hi?1320:760; o.connect(g); g.connect(audioCtx.destination); const t=audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+(hi?0.35:0.12)); o.start(t); o.stop(t+(hi?0.4:0.15)); }catch(e){}
}

function checkAch(){
  const n=S.sessions.length, got=S.achievements, out=[];
  const vol=S.sessions.reduce((a,s)=>a+(s.vol||0),0);
  const prs=S.sessions.reduce((a,s)=>a+(s.prs||[]).length,0);
  const st=streakWeeks();
  const hours=S.sessions.map(s=>new Date(s.start).getHours());
  const cond={first:n>=1,s5:n>=5,s25:n>=25,s50:n>=50,s100:n>=100,w2:st>=2,w4:st>=4,w12:st>=12,pr1:prs>=1,pr25:prs>=25,vol10:vol>=10000,vol100:vol>=100000,
    early:hours.some(h=>h<8),night:hours.some(h=>h>=22),measure:S.measures.length>0,pandaria:(S.applied||0)>=5};
  Object.entries(cond).forEach(([k,v])=>{ if(v && !got[k]){ got[k]=Date.now(); out.push(k); } });
  if (out.length){ save(); const a=ACHIEVEMENTS.find(x=>x.id===out[0]); setTimeout(()=>toast(`${a.ic} Logro: ${esc(a.n)}`),900); }

}

const INT_FMT = {
  tabata:{n:'Tabata',d:'20 s de trabajo y 10 s de descanso, 8 rondas por tanda.'},
  hiit:{n:'HIIT',d:'Tú eliges trabajo, descanso, rondas y tandas.'},
  emom:{n:'EMOM',d:'Cada minuto empiezas una serie; descansas lo que sobre del minuto.'},
  amrap:{n:'AMRAP',d:'Tantas rondas como puedas en el tiempo elegido.'}
};
function intDefaults(){ return {fmt:'tabata',work:20,rest:10,rounds:8,sets:1,setRest:60,emomMin:10,emomReps:10,amrapMin:12,prep:10,ex:['burpees','sentadilla_salto','mountain_climbers','flexiones']}; }
function intPhases(c){
  const ph=[{type:'prep',dur:c.prep,label:'Prepárate'}];
  const exs=c.ex.length?c.ex:[null];
  let k=0;
  if (c.fmt==='tabata'||c.fmt==='hiit'){
    const work=c.fmt==='tabata'?20:c.work, rest=c.fmt==='tabata'?10:c.rest, rounds=c.fmt==='tabata'?8:c.rounds;
    for (let s=1;s<=c.sets;s++){
      for (let r=1;r<=rounds;r++){
        ph.push({type:'work',dur:work,ex:exs[k++%exs.length],round:r,rounds,set:s,sets:c.sets});
        if (r<rounds && rest>0) ph.push({type:'rest',dur:rest,round:r,rounds,set:s,sets:c.sets});
      }
      if (s<c.sets) ph.push({type:'rest',dur:c.setRest,label:'Descanso entre tandas',round:rounds,rounds,set:s,sets:c.sets});
    }
  } else if (c.fmt==='emom'){
    for (let m=1;m<=c.emomMin;m++) ph.push({type:'work',dur:60,ex:exs[k++%exs.length],round:m,rounds:c.emomMin,emom:true});
  } else {
    ph.push({type:'work',dur:c.amrapMin*60,ex:null,round:1,rounds:1,amrap:true});
  }
  return ph;
}

  return lhdr('Modo intervalos')+`<div class="lbody">${b}</div><div class="lfoot"><button class="btn pri big" data-a="intStart">${I('play',20)} Empezar</button></div>`;

let HSEG='resumen', HM=null, PEX=null;

/* ---------- Gráficas ---------- */
function lineChart(pts, o){
  o=o||{}; if (pts.length<2) return '';
  const W=320,H=150,pl=34,pr=10,pt=14,pb=24;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const grid=[0,0.5,1].map(f=>{ const v=mn+(mx-mn)*f; return `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${fmtNum(Math.round(v*10)/10)}</text>`; }).join('');
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const area=d+`L${x(pts.length-1)},${H-pb}L${pl},${H-pb}Z`;
  const lbl=[0,pts.length-1].map(i=>{ const dt=new Date(pts[i].x); return `<text x="${x(i)}" y="${H-6}" text-anchor="${i?'end':'start'}">${dt.getDate()}/${dt.getMonth()+1}</text>`; }).join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${grid}<path d="${area}" fill="var(--ac)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.y)}" r="${i===pts.length-1?4:2.5}" fill="var(--ac)"/>`).join('')}${lbl}
    <text x="${x(pts.length-1)}" y="${y(last.y)-9}" text-anchor="end" style="fill:var(--tx);font-weight:700;font-size:11px">${fmtNum(last.y)} ${o.unit||''}</text></svg>`;
}
function barChart(vals, labels, o){
  o=o||{}; const W=320,H=150,pl=8,pr=8,pt=18,pb=22; const mx=Math.max(1,...vals);
  const bw=(W-pl-pr)/vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    ${vals.map((v,i)=>{ const h=(H-pt-pb)*v/mx; const xx=pl+i*bw+bw*0.18; const last=i===vals.length-1;
      return `<rect x="${xx}" y="${H-pb-h}" width="${bw*0.64}" height="${Math.max(h,v?2:0)}" rx="3" fill="var(--ac)" opacity="${last?1:.55}"/>${v&&(last||vals.length<=8)?`<text x="${xx+bw*0.32}" y="${H-pb-h-4}" text-anchor="middle" style="${last?'fill:var(--tx);font-weight:700':''}">${o.fmt?o.fmt(v):fmtNum(v)}</text>`:''}${labels[i]?`<text x="${xx+bw*0.32}" y="${H-7}" text-anchor="middle">${labels[i]}</text>`:''}`; }).join('')}</svg>`;
}

function planRoutines(){ if(!S.plan) return []; return S.plan.order.map(id=>findR(id)).filter(r=>r&&!r.archived); }
function nextInPlan(){
  const rs=planRoutines(); if(!rs.length) return null;
  const last=[...S.sessions].reverse().find(s=>rs.some(r=>r.id===s.routineId));
  let i=0; if (last){ i=(rs.findIndex(r=>r.id===last.routineId)+1)%rs.length; }
  const cand=rs[i];
  if (recoveryWarning(cand).length){
    for (let k=1;k<rs.length;k++){ const alt=rs[(i+k)%rs.length]; if (!recoveryWarning(alt).length) return {r:alt,swapped:cand}; }
  }
  return {r:cand};
}

  if (!S.plan || !planRoutines().length){
    if (S.routines.filter(r=>!r.archived).length<2) return '';

  else { let k=1; while(k<8 && !S.plan.days.includes((dow+k)%7)) k++;
    body=`<div class="xs mut b" style="letter-spacing:1px">HOY</div><div class="b" style="font-size:20px;margin-top:2px">Día de descanso</div><div class="sm mut" style="margin-top:4px">Próximo entreno: ${k===1?'mañana':DAYS_LONG[(dow+k)%7]} · ${esc(nx.r.name)}</div>

  return `<div class="card hoy">${strip}<div style="margin-top:12px">${body}</div><button class="xs mut" style="margin-top:10px" data-a="openPlan">${I('edit',12).replace('<svg','<svg style="display:inline;vertical-align:-2px"')} Editar plan semanal</button></div>`;
}
