<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#181c23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="PandarIA Fit: rutinas, entrenamiento guiado, historial y un algoritmo que te ayuda a progresar.">
<title>PandarIA Fit</title>
<style>
:root{
  --bg:#12151a; --bg2:#181c23; --card:#1f242d; --card2:#282e39; --line:#2f3642;
  --tx:#eef1f5; --mut:#8b94a3; --mut2:#5d6573;
  --ac:#ff7a1a; --ac2:#ff9a4d; --acs:rgba(255,122,26,.14);
  --ok:#2fd27a; --oks:rgba(47,210,122,.16); --bad:#ff4d5a; --bads:rgba(255,77,90,.14);
  --blue:#4aa8ff; --blues:rgba(74,168,255,.14); --gold:#ffc83d;
  --r:16px; --nav:64px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --bg2:#ffffff; --card:#ffffff; --card2:#eef0f4; --line:#e1e4ea;
  --tx:#161a20; --mut:#69717f; --mut2:#9aa1ad;
  --acs:rgba(255,122,26,.12); --oks:rgba(47,180,100,.14); --ok:#22b465;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
svg{display:block}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#view{flex:1;overflow-y:auto;padding:0 16px calc(var(--nav) + 24px + var(--safe-b));-webkit-overflow-scrolling:touch}
/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:500;position:relative}
#nav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
#nav button.on{color:var(--tx)}
#nav button.on .pill{background:var(--acs);color:var(--ac)}
#nav .dot{position:absolute;top:8px;left:calc(50% + 12px);width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--bg2)}
/* Header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:26px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px}
.hdr .sub{color:var(--mut);font-size:13px}
.brand{display:flex;align-items:center;gap:8px}
.brand b{color:var(--ac)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--card2);color:var(--tx);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:#1a0d02}
.btn.ok{background:var(--ok);color:#03200f}
.btn.ghost{background:transparent;color:var(--ac)}
.btn.danger{background:var(--bads);color:var(--bad)}
.btn.big{height:58px;font-size:17px;border-radius:18px;width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn.wide{width:100%}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--tx)}
.ibtn:active{background:var(--card2)}
.ibtn.soft{background:var(--card2)}
.link{color:var(--ac);font-weight:700;letter-spacing:.3px}
/* Cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:11.5px}
.b{font-weight:700} .ttl{font-size:17px;font-weight:700}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:22px 2px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--card2);color:var(--tx);font-size:13.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}
.tag.ac{background:var(--acs);color:var(--ac)}
.tag.ok{background:var(--oks);color:var(--ok)}
.tag.blue{background:var(--blues);color:var(--blue)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:44px;margin-bottom:8px}
.diff{display:inline-flex;gap:3px;align-items:flex-end}
.diff i{width:5px;border-radius:2px;background:var(--mut2)}
.diff i:nth-child(1){height:7px}.diff i:nth-child(2){height:11px}.diff i:nth-child(3){height:15px}
.diff.l1 i:nth-child(1),.diff.l2 i:nth-child(-n+2),.diff.l3 i{background:var(--ac)}
/* Routine card */
.rcard .exs{color:var(--mut);font-size:13.5px;line-height:1.45;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--ac);display:inline-block}
.newbtn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:var(--r);background:var(--ac);color:#1a0d02;font-weight:800;font-size:16px;margin-bottom:16px}
.newbtn .pl{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.14);display:grid;place-items:center}
/* Banner */
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;background:var(--acs);border:1px solid rgba(255,122,26,.3)}
.banner.blue{background:var(--blues);border-color:rgba(74,168,255,.3)}
.banner.ok{background:var(--oks);border-color:rgba(47,210,122,.3)}
.banner .ic{flex:0 0 auto;color:var(--ac)}
.banner.blue .ic{color:var(--blue)} .banner.ok .ic{color:var(--ok)}
/* Exercise icon */
.exi{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;position:relative;overflow:hidden}
.exi.sm{width:36px;height:36px;border-radius:10px}
.onclr .diff i{background:rgba(255,255,255,.35)}
.onclr .diff.l1 i:nth-child(1),.onclr .diff.l2 i:nth-child(-n+2),.onclr .diff.l3 i{background:#fff}
.exi.lg{width:96px;height:96px;border-radius:24px}
.exi .ini{font-weight:800;font-size:16px}
/* Layers */
.layer{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:slin .22s ease}
.layer .lhdr{display:flex;align-items:center;gap:6px;padding:10px 8px;min-height:62px;border-bottom:1px solid var(--line);background:var(--bg2)}
.layer .lhdr h2{flex:1;margin:0;font-size:18px;font-weight:700;padding-left:4px}
.layer .lbody{flex:1;overflow-y:auto;padding:16px 16px 40px}
.layer .lfoot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg2)}
@keyframes slin{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.scrim.center{align-items:center;padding:20px}
@keyframes fd{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--bg2);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--safe-b));animation:up .2s ease;max-height:88vh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:4px 4px 14px;font-size:19px}
.modal{width:100%;max-width:420px;background:var(--bg2);border-radius:22px;padding:22px;animation:up .2s}
.modal h3{margin:0 0 8px;font-size:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px 10px;border-radius:14px;text-align:left}
.opt:active{background:var(--card2)}
.opt .oi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--acs);color:var(--ac);flex:0 0 auto}
.opt.danger{color:var(--bad)} .opt.danger .oi{background:var(--bads);color:var(--bad)}
.opt .od{color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 8px;font-size:15.5px;border-radius:12px;text-align:left}
.mi:active{background:var(--card2)}
.mi svg{color:var(--blue)} .mi.danger,.mi.danger svg{color:var(--bad)}
/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:7px}
.inp{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--ac)}
textarea.inp{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:13px;top:13px;color:var(--mut)}
.search .inp{padding-left:42px}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;font-weight:600;color:var(--mut);font-size:14px}
.seg button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--ac)} .toggle.on::after{left:23px}
.srow{display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .si{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--ac);flex:0 0 auto}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut2);display:grid;place-items:center;flex:0 0 auto}
.check.on{background:var(--ac);border-color:var(--ac);color:#1a0d02}
input[type=range]{width:100%;accent-color:var(--ac)}
/* Workout */
.wk-top{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:62px;background:var(--bg2);border-bottom:1px solid var(--line)}
.wk-top .clock{flex:1;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums;font-size:16px}
.wk-ex{margin:0 -16px;padding:18px 16px 6px;border-bottom:8px solid var(--bg2)}
.wk-ex .exh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wk-ex .exn{flex:1;min-width:0;color:var(--blue);font-weight:700;font-size:17px;line-height:1.25}
.wk-ex .note{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:8px;color:var(--mut)}
.wk-ex .note.sticky{background:rgba(255,200,61,.12);color:var(--gold)}
.sgrid{display:grid;grid-template-columns:40px 1fr 74px 74px 46px;align-items:center;gap:8px}
.sgrid.nokg{grid-template-columns:40px 1fr 96px 46px}
.shead{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--mut);padding:4px 0 6px;text-align:center}
.shead>:nth-child(2){text-align:left}
.srw{padding:5px 0;border-radius:10px;transition:background .2s}
.srw.done{background:var(--oks)}
.snum{height:40px;border-radius:10px;font-weight:700;display:grid;place-items:center;font-size:15px}
.snum.c{color:var(--gold)} .snum.f{color:var(--bad)} .snum.d{color:var(--blue)}
.sprev{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sinp{width:100%;height:42px;border-radius:10px;border:0;background:var(--card2);text-align:center;font-size:17px;font-weight:600;outline:none;padding:0 4px;-moz-appearance:textfield}
.sinp::-webkit-outer-spin-button,.sinp::-webkit-inner-spin-button{-webkit-appearance:none}
.sinp::placeholder{color:var(--mut2);font-weight:500}
.sinp:focus{box-shadow:0 0 0 2px var(--ac)}
.srw.done .sinp{background:transparent}
.sck{width:42px;height:42px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut2)}
.srw.done .sck{background:var(--ok);color:#03200f}
.restline{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:14px;font-weight:600;padding:2px 0}
.restline::before,.restline::after{content:'';flex:1;height:3px;border-radius:2px;background:var(--blues)}
.restline.done{color:var(--ok)} .restline.done::before,.restline.done::after{background:var(--oks)}
.restline.cus{color:var(--ac)} .restline.cus::before,.restline.cus::after{background:rgba(255,122,26,.28)}
.restline .rtag{font-size:11px;font-weight:700;opacity:.85}
.erest{grid-column:1/-1;justify-self:center;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);padding:0 12px;height:20px;margin:-3px 0;border-radius:10px}
.erest.on{color:var(--ac);font-weight:700;background:rgba(255,122,26,.1)}
.restbar button.fix{width:46px;font-size:12px;background:rgba(0,0,0,.18)}
.restbar{position:relative;height:44px;border-radius:12px;background:var(--card2);overflow:hidden;margin:6px 0;display:flex;align-items:center}
.restbar .fill{position:absolute;inset:0 auto 0 0;background:var(--blue);transition:width 1s linear}
.restbar .t{position:relative;flex:1;text-align:center;font-weight:800;font-size:18px;color:#fff;font-variant-numeric:tabular-nums}
.restbar button{position:relative;width:52px;height:100%;font-weight:700;color:#fff;font-size:13px}
.ssup{border-left:3px solid var(--ac);padding-left:10px;margin-left:-13px}
.suptag{font-size:11px;color:var(--ac);font-weight:800;letter-spacing:.8px;margin-bottom:6px}
.minibar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + var(--safe-b));z-index:25;max-width:536px;margin:0 auto;background:var(--ac);color:#1a0d02;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + var(--safe-b));transform:translateX(-50%);z-index:80;background:var(--card2);color:var(--tx);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .2s;max-width:90vw;text-align:center;border:1px solid var(--line)}
.in-layer .toast{bottom:auto;top:74px}
.toast.pr{background:var(--gold);color:#2a1d00}
/* Edit routine */
.eitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.eitem.sup{border-left:4px solid var(--ac)}
.esets{display:grid;grid-template-columns:40px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:10px}
.esets.nokg{grid-template-columns:40px 1fr 34px}
.esets .sinp{height:38px;font-size:15px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:13.5px;position:relative}
.cal .d.on{background:var(--ac);color:#1a0d02;font-weight:800}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ac)}
.cal .d.out{opacity:.25}
.stat{background:var(--card2);border-radius:14px;padding:12px;flex:1;min-width:0}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach .a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.ach .a .e{font-size:28px;filter:grayscale(1);opacity:.35}
.ach .a.on .e{filter:none;opacity:1}
.ach .a .n{font-size:12.5px;font-weight:700;margin-top:6px}
.ach .a .dd{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.3}
.photo{width:100%;border-radius:12px;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
/* Explore */
.xsec{margin-top:22px}
.xsec .xh{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.xcards{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.xcards::-webkit-scrollbar{display:none}
.xcard{flex:0 0 74%;max-width:280px;scroll-snap-align:start;border-radius:18px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;position:relative;overflow:hidden}
.xcard .xn{font-weight:800;font-size:17px;line-height:1.2;position:relative}
.xcard .xm{font-size:12.5px;opacity:.9;position:relative;display:flex;gap:10px;align-items:center}
.xcard .diff i{background:rgba(255,255,255,.35)}
.xcard .diff.l1 i:nth-child(1),.xcard .diff.l2 i:nth-child(-n+2),.xcard .diff.l3 i{background:#fff}
.xcard svg.bgi{position:absolute;right:-8px;bottom:-8px;opacity:.22}
.xhero{border-radius:20px;padding:18px;background:linear-gradient(135deg,var(--ac),#ff4f3a);color:#1a0702;margin:4px 0 6px}
.xhero h2{margin:0 0 6px;font-size:19px;line-height:1.25}
.xhero p{margin:0;font-size:13px;opacity:.85;line-height:1.4}
/* Summary */
.sumhero{text-align:center;padding:20px 0 10px}
.sumhero .big{font-size:54px}
.int-wrap{padding:6px 2px}
.int-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.int-val{font-size:30px;font-weight:800;text-align:center;margin:6px 0}
.chart text{fill:var(--mut);font-size:10px}
.bodymap .base{fill:var(--card2)}
.sugg{border-radius:var(--r);border:1px solid rgba(255,122,26,.35);background:var(--acs);padding:14px;margin-bottom:10px}
.sugg .why{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.sugg .acts{display:flex;gap:8px;margin-top:12px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:120px;margin:12px 0}
.plates .bar{width:60px;height:10px;background:#9aa1ad;border-radius:3px}
.plates .p{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;writing-mode:vertical-rl}
.drag{color:var(--mut2)}
@media (min-width:561px){body{background:#0b0d10}}

.exi .exfig{width:86%;height:86%}
.exanim{position:relative;border-radius:22px;aspect-ratio:1;width:100%;max-width:260px;margin:0 auto;padding:3%;overflow:hidden;background:linear-gradient(170deg,#262e3a,#12161c);background:radial-gradient(110% 80% at 15% 0%,color-mix(in srgb,var(--exc) 45%,transparent),transparent 62%),linear-gradient(170deg,#262e3a,#12161c)}
.exanim svg{display:block}
.exanim .exsvg{width:100%;height:100%}

html[data-fx=on] .fx-pop{animation:popRow .45s ease}

/* ============ PandarIA · MOTOR DE ENTRENAMIENTO ============
   Basado en guías de entrenamiento de fuerza (ACSM, NSCA):
   - Rangos de repeticiones, series y descansos por objetivo.
   - Sobrecarga progresiva con doble progresión y aumentos de carga del 2–10 %.
   - Volumen semanal por músculo (10–20 series para hipertrofia).
   - Descarga periódica, ajuste por desentrenamiento y por esfuerzo percibido.
*/
const EX = {};
function loadExercises(custom){
  for (const k in EX) delete EX[k];
  EX_RAW.trim().split('\n').forEach(line=>{
    const [id,n,pat,eq,prim,sec,kind,lvl,mode,tip]=line.split('|');
    EX[id]={id,n,pat,eq:eq.split('+'),prim:prim.split(','),sec:sec?sec.split(','):[],kind,lvl:+lvl,mode,tip:tip||''};
  });
  (custom||[]).forEach(c=>{ EX[c.id]=Object.assign({sec:[],kind:'c',lvl:1,tip:'',custom:true},c); });
}
const getEx = id => EX[id] || {id,n:'Ejercicio eliminado',pat:'core',eq:['pc'],prim:['abdomen'],sec:[],kind:'a',lvl:1,mode:'r',tip:'',missing:true};

const LOWER_MUSCLES = ['cuadriceps','isquios','gluteos','gemelos','aductores','abductores'];
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const DAY = 86400000;
const roundTo = (v,step)=> Math.max(step, Math.round(v/step)*step);
const e1rm = (kg,reps)=> kg*(1+Math.min(reps,kb('fuerza.e1rm').maxReps)/kb('fuerza.e1rm').div);
const userLevel = () => LEVELS[S.settings.level]||1;
const isLower = ex => ex.prim.some(m=>LOWER_MUSCLES.includes(m)) || ['sentadilla','bisagra','zancada','gluteo'].includes(ex.pat);
function incFor(ex){
  const e = ex.eq;
  if (e.includes('bar')||e.includes('smi')||e.includes('hex')||e.includes('ez')) return (S.settings.minPlate||1.25)*2;
  if (e.includes('lmn')) return 2.5; // un solo extremo cargado
  if (e.includes('kb')) return 4;
  if (e.includes('man')) return 2;
  if (e.includes('maq')) return 5;
  if (e.includes('pol')) return 2.5;
  return 2.5;
}
function hasEquip(ex, set){

  return ex.eq.every(q => q==='pc' || q==='est' || set.includes(q));
}
const avoided = id => !!(S.settings.avoid||{})[id] || (typeof profileBlocks==='function' && profileBlocks(id));

/* ---------- Historial ---------- */
function exHistory(exId, limit){
  const out=[];
  for (let i=S.sessions.length-1;i>=0;i--){
    const s=S.sessions[i];
    const it=s.items.find(x=>x.exId===exId);
    if (!it) continue;
    const work=it.sets.filter(x=>x.done && x.t!=='c');
    if (!work.length) continue;
    out.push({date:s.end||s.start, sets:work, all:it.sets, intensity:s.intensity||6, sid:s.id, chk:s.checkin||null});
    if (limit && out.length>=limit) break;
  }
  return out;
}
function sessionScore(entry, ex){
  if (ex.mode==='p') return Math.max(...entry.sets.map(x=>e1rm(+x.kg||0,+x.reps||0)));
  if (ex.mode==='t') return Math.max(...entry.sets.map(x=>+x.time||0));
  return entry.sets.reduce((a,x)=>a+(+x.reps||0),0);
}
function lastTrainedDays(){
  if (!S.sessions.length) return null;
  return (Date.now()-(S.sessions[S.sessions.length-1].end||0))/DAY;
}

/* ---------- Prescripción ---------- */
function prescribe(ex, goal, level){
  const G = GOALS[goal]||GOALS.musculo;
  let sets = G.sets + (level===1?-1:level===3?1:0);
  let range = G.reps.slice();
  let rest = G.rest;
  if (ex.kind==='a'){ sets=Math.min(sets,3); range=[range[0]+2,range[1]+3]; rest=Math.min(rest,90); }
  if (goal==='fuerza' && ex.kind==='a'){ range=[8,12]; rest=90; }
  sets=Math.max(2,Math.min(5,sets));
  let time=null;
  if (ex.mode==='t'){
    if (ex.pat==='cardio' && ['cin','bic','eli','rem'].some(q=>ex.eq.includes(q))){ sets=1; time=goal==='grasa'||goal==='resistencia'?1200:600; rest=60; }
    else if (['yoga','estiramiento','movilidad'].includes(ex.pat)){ time= ex.id==='mov_articular'?300: ex.id==='yoga_saludo'?180:G.t+5; sets= ex.id==='mov_articular'?1:2; rest=10; }
    else if (ex.id==='caminata'){ sets=1; time=900; rest=30; }
    else time = G.t + (level-1)*10;
  }
  if (ex.mode==='r' && ex.pat==='cardio'){ range=[10,15]; }
  if (ex.mode==='r' && level===1 && ex.kind==='c') range=[Math.max(6,range[0]-2),range[1]];
  const pr=S.profile||{};
  const KM=kb('seguridad.mayores'), KJ=kb('seguridad.menores');
  if (pr.age>=KM.edad && ex.mode!=='t') rest+=KM.s;
  if (pr.fitness==='sedentario' && ex.mode!=='t' && sets>2) sets+=kb('seguridad.sedentario').series;
  if (pr.age && pr.age<KJ.edad && range[0]<KJ.repsMin) range=[KJ.repsMin,Math.max(range[1],KJ.repsMax)];
  return {sets, range, rest, time};
}
function buildItem(exId, goal, level, opts){
  const ex=getEx(exId), p=prescribe(ex,goal,level);
  const kg = ex.mode==='p' ? estimateKg(exId, p.range[0]) : null;
  const sets=[];
  for (let i=0;i<p.sets;i++) sets.push({t:'n', reps: ex.mode==='t'?null:p.range[0], kg: kg, time:p.time});
  return Object.assign({uid:uid(), exId, sets, rest:p.rest, range: ex.mode==='t'?null:p.range, superset:null, note:'', sticky:''}, opts||{});
}

/* ---------- Estimación de peso inicial ---------- */
const EQ_FACTOR = {hex:1.05, bar:1, smi:0.9, ez:0.95, maq:1, lmn:0.5, pol:0.7, man:0.4, kb:0.35};
function eqFactor(ex){ for (const q of ['hex','bar','smi','ez','maq','lmn','pol','man','kb']) if (ex.eq.includes(q)) return EQ_FACTOR[q]; return 1; }
const BW_RATIO = { /* 1RM relativo al peso corporal con barra/máquina, por nivel */
  sentadilla:[0.8,1.1,1.5], bisagra:[1.0,1.3,1.8], zancada:[0.5,0.7,0.9], empuje_h:[0.6,0.85,1.1], empuje_v:[0.4,0.55,0.7],
  tiron_h:[0.55,0.75,1.0], tiron_v:[0.6,0.8,1.0], curl:[0.25,0.35,0.45], extension:[0.2,0.3,0.4], elevacion:[0.25,0.35,0.45],
  apertura:[0.3,0.4,0.5], gluteo:[1.0,1.4,1.9], ext_pierna:[0.5,0.7,0.9], curl_pierna:[0.35,0.5,0.65], gemelo:[0.8,1.1,1.4],
  abduccion:[0.5,0.7,0.9], core:[0.3,0.4,0.5], cargar:[0.6,0.8,1.0]
};
function bodyWeight(){ const m=[...S.measures].reverse().find(x=>x.peso); return m? +m.peso : (S.profile&&+S.profile.weight)||70; }
function estimateKg(exId, reps){
  const ex=getEx(exId); if (ex.mode!=='p') return null;
  const own = exHistory(exId,1)[0];
  if (own){ const b=own.sets.reduce((a,x)=>(+x.kg||0)>a?+x.kg:a,0); if (b) return b; }
  // ejercicio relacionado con historial
  let best=null;
  for (const id in EX){
    const o=EX[id]; if (id===exId||o.mode!=='p'||o.pat!==ex.pat||!o.prim.some(m=>ex.prim.includes(m))) continue;
    const h=exHistory(id,1)[0]; if (!h) continue;
    const s=sessionScore(h,o); const conv = s*eqFactor(ex)/eqFactor(o);
    if (!best||conv>best) best=conv;
  }
  let one = best;
  if (!one){
    const r=BW_RATIO[ex.pat]; if (!r) return null;
    const K=kb('peso.inicial');
    one = bodyWeight()*r[userLevel()-1]*eqFactor(ex)*K.prudente; // inicio conservador
    const pr=S.profile||{};
    if (pr.sex==='m') one*= isLower(ex)?K.mujerInf:K.mujerSup; else if (pr.sex==='x') one*=K.otro;
    if (pr.fitness==='sedentario') one*=K.sedentario;
    if (pr.age>=K.edadMayor) one*=K.mayor;
    if (ex.id==='prensa') one*=2;
  }
  const w = one/(1+reps/kb('fuerza.e1rm').div)*kb('peso.inicial').final;
  return roundTo(w, incFor(ex));
}

/* ---------- Sugerencia en vivo para cada serie ---------- */
function deloadActive(){ return S.deload && S.deload.until>Date.now(); }
function phaseAt(ts){ const st=S.periodStart||S.firstSession; if(!st||S.settings.period===false||ts<st) return null; const B=kb('bloque'), w=Math.floor((ts-st)/(7*DAY))%(B.vol+B.int+B.des); return w<B.vol?'volumen':w<B.vol+B.int?'intensidad':'descarga'; }
function inDeloadWindow(ts){ return !!((S.deload && ts>=S.deload.start && ts<=S.deload.until) || phaseAt(ts)==='descarga'); }
function suggestSet(routine, item, idx){
  const ex=getEx(item.exId), set=item.sets[idx]||{};
  const hist0=exHistory(item.exId,8);
  const work=item.sets.filter(x=>x.t!=='c');
  const wIdx=work.indexOf(set);
  let range=item.range||[(+set.reps||10),(+set.reps||10)+2];
  const ph=(typeof periodPhase==='function')?periodPhase(routine):null;
  if (ph==='intensidad') range=[Math.max(1,range[0]-2),Math.max(2,range[1]-2)];
  // las semanas de descarga no cuentan como referencia de progreso
  const normal=hist0.filter(h=>!inDeloadWindow(h.date));
  const hist=(normal.length?normal:hist0).slice(0,3);
  const res={kg:set.kg, reps:set.reps, time:set.time, why:''};
  if (set.t==='c'){ // calentamiento: % del peso de trabajo
    const target = suggestSet(routine,item,item.sets.indexOf(work[0]||set));
    const wu=item.sets.filter(x=>x.t==='c'); const k=wu.indexOf(set);
    const KC=kb('calentamiento'); const pct=KC.pct[Math.min(k,2)];
    if (target.kg) res.kg=roundTo(target.kg*pct, incFor(ex));
    res.reps=KC.reps[Math.min(k,2)]; res.why='Serie de calentamiento';
    return res;
  }
  if (!hist.length){ if (ex.mode==='p' && !res.kg) res.kg=estimateKg(item.exId, range[0]); res.why= res.kg?'Peso inicial estimado por PandarIA':''; return res; }
  const last=hist[0];
  const ref=last.sets[Math.min(wIdx<0?0:wIdx,last.sets.length-1)];
  if (!routine || !routine.pandaria){ return {kg:ref.kg, reps:ref.reps, time:ref.time, why:'Lo de la última vez'}; }
  const days=(Date.now()-last.date)/DAY;
  if (ex.mode==='p'){
    const allTop=last.sets.every(x=>(+x.reps||0)>=range[1]);
    const fails = h => h && h.sets.some(x=>(+x.reps||0)<range[0]);
    const twoFails = fails(hist[0]) && fails(hist[1]);
    let kg=+ref.kg||0, reps=+ref.reps||range[0];
    const RPE=kb('carga.esfuerzo').rpe;
    if (allTop && last.intensity<RPE){
      const pct = isLower(ex)?kb('carga.subida').inf:kb('carga.subida').sup;
      let inc=Math.max(incFor(ex), kg*pct); if (last.intensity<=4) inc*=2;
      const rirs=last.sets.map(x=>x.rir).filter(x=>x!=null); const rirAvg=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;
      if (rirAvg!=null && rirAvg>=3) inc*=1.5;
      kg=roundTo(kg+inc, incFor(ex)); reps=range[0]; res.why='Completaste todas las series: sube el peso';
    } else if (twoFails){
      kg=roundTo(kg*kb('carga.bajada').f, incFor(ex)); reps=range[0]; res.why='Dos sesiones sin llegar: bajamos 10 % para consolidar';
    } else if (last.intensity>=RPE){ reps=Math.min(reps,range[1]); res.why='Sesión anterior muy exigente: mantén'; }
    else { const rr=last.sets.map(x=>x.rir).filter(x=>x!=null); const ra=rr.length?rr.reduce((a,b)=>a+b,0)/rr.length:null;
      reps=Math.max(range[0],Math.min(reps+(ra!=null&&ra>=3?kb('carga.doble').repsFacil:kb('carga.doble').reps),range[1])); res.why= (+ref.reps||0)<range[0]?'Mismo peso: busca llegar al mínimo de repeticiones':'Intenta una repetición más'; }
    const KP=kb('regreso.pausa'); if (days>=KP.dias[0]){ const f=days>=KP.dias[2]?KP.f[2]:days>=KP.dias[1]?KP.f[1]:KP.f[0]; kg=roundTo(kg*f,incFor(ex)); res.why=`Volviste tras ${Math.round(days)} días: ajustamos el peso`; }
    if (deloadActive()){ kg=roundTo(kg*kb('descarga').f,incFor(ex)); res.why='Semana de descarga: más liviano'; }
    else if (ph==='descarga'){ kg=roundTo(kg*kb('descarga').f,incFor(ex)); res.why='Semana de descarga del bloque: más liviano'; }
    else if (ph==='intensidad') res.why+=' · bloque de intensidad (menos reps, más peso)';
    res.kg=kg||null; res.reps=reps;
  } else if (ex.mode==='r'){
    let reps=+ref.reps||range[0];
    if (last.intensity<9) reps+=1;
    if (days>=14) reps=Math.max(range[0],Math.round(reps*0.85));
    if (deloadActive()) reps=Math.max(range[0],Math.round(reps*0.75));
    res.reps=reps; res.why= last.intensity<9?'Una repetición más que la última vez':'Mantén las repeticiones';
  } else {
    let t=+ref.time||+set.time||30;
    if (last.intensity<9 && !['cardio','movilidad','estiramiento','yoga'].includes(ex.pat) && !item.warm && !item.cool) t+=5;
    if (days>=14) t=Math.round(t*0.85);
    res.time=t; res.why= t>(+ref.time||0)?'Un poco más que la última vez':'';
  }
  return res;
}
function prevText(exId, idx, mode){
  const h=exHistory(exId,1)[0]; if (!h) return '';
  const s=h.sets[Math.min(idx,h.sets.length-1)]; if (!s) return '';
  if (mode==='p') return `${fmtKg(s.kg)} × ${s.reps}`;
  if (mode==='t') return fmtTime(s.time);
  return `${s.reps} reps`;
}

/* ---------- Alternativas ---------- */
function alternatives(exId, exclude){
  const ex=getEx(exId), L=userLevel(); exclude=exclude||[];
  const out=[];
  for (const id in EX){
    const o=EX[id]; if (id===exId||exclude.includes(id)||avoided(id)||!hasEquip(o)) continue;
    let sc=0;
    if (o.prim[0]===ex.prim[0]) sc+=4; else if (o.prim.some(m=>ex.prim.includes(m))) sc+=2; else continue;
    if (o.pat===ex.pat) sc+=3;
    if (o.kind===ex.kind) sc+=1;
    if (o.lvl>L) sc-=2;
    if (o.mode===ex.mode) sc+=1;
    // si molesta, primero la versión guiada (máquina, Smith o polea) del mismo movimiento
    const guided=o.eq.some(q=>['maq','smi','pol'].includes(q));
    if ((S.settings.avoid||{})[exId]==='molesta' && guided) sc+=2;
    else if (o.eq.some(q=>ex.eq.includes(q))) sc+=0.5;
    out.push([sc,id]);
  }
  return out.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
function nextProgression(exId){
  for (const p of PROGRESSIONS){ const i=p.indexOf(exId); if (i>=0 && i<p.length-1){ const n=p[i+1]; if (hasEquip(getEx(n))) return n; } }
  return null;
}

// Cada serie puede tener su propio descanso (s.rest); si no lo tiene, usa el del ejercicio (it.rest).
const REST_OPTS=[0,15,30,45,60,75,90,120,150,180,240,300];
function restFor(it,i){ const s=it&&it.sets&&it.sets[i]; return (s&&s.rest!=null)? +s.rest : (+(it&&it.rest)||0); }
function restCustom(it,i){ const s=it&&it.sets&&it.sets[i]; return !!(s&&s.rest!=null&&+s.rest!==(+it.rest||0)); }
function restClean(it){ it.sets.forEach(s=>{ if(s.rest!=null && +s.rest===(+it.rest||0)) delete s.rest; }); }
function restPreset(it,kind){
  const base=+it.rest||60;
  if (kind==='same'){ it.sets.forEach(s=>{ delete s.rest; delete s.rsug; }); return 'Todas las series con '+fmtTime(base); }
  if (kind==='warm'){
    const w=it.sets.filter(s=>s.t==='c'); if(!w.length) return 'Este ejercicio no tiene series de calentamiento';
    const v=Math.max(30,Math.round(base/2/15)*15); w.forEach(s=>{ s.rest=v; delete s.rsug; }); restClean(it); return 'Calentamientos con '+fmtTime(v)+' de descanso';
  }

    if (W.length<3) return 'Necesitas al menos 3 series de trabajo para esto';
    W.slice(-2).forEach(k=>{ const s=it.sets[k-1]; s.rest=restFor(it,k-1)+30; delete s.rsug; }); restClean(it); return '+30 s antes de las dos últimas series';
  }
}

function pickExercise(slot, ctx){

    // principiantes: máquinas y Smith guían la técnica; avanzados: más peso libre
    const guided=o.eq.some(q=>['maq','smi'].includes(q)), free=o.eq.some(q=>['bar','man','kb','hex','ez','lmn'].includes(q));
    if (L===1 && guided) sc+=1.5; else if (L===1 && o.eq.includes('pol')) sc+=0.7;

function pickSecondary(m, ctx){

/* ---------- Orden lógico de una sesión ----------

const LEGS=['cuadriceps','isquios','gluteos','aductores','abductores'];

  const warm=items.filter(i=>i.warm), cool=items.filter(i=>i.cool), main=items.filter(i=>!i.warm&&!i.cool);

  const key=it=>{ const ex=getEx(it.exId), g=exGroup(ex);

function fillDay(slots, opts){
  const ctx={level:opts.level, goal:opts.goal, equip:opts.equip, dayUsed:new Set(), dayPat:new Set(), progUsed:opts.progUsed||new Set(), idx:0};
  const items=[]; let mins=0; const budget=opts.minutes;
  const warm = budget>=25 && opts.goal!=='flexibilidad';
  const older=(S.profile||{}).age>=50;
  if (warm){ const w=buildItem('mov_articular',opts.goal,opts.level); w.sets=[{t:'n',time:older?420:300,reps:null,kg:null}]; w.rest=10; w.warm=true; items.push(w); mins+=older?7:5; }
  const cool = budget>=30 ? 4 : 0;
  let i=0, guard=0;
  while (guard++<40){
    const slot=slots[i%slots.length]; i++;
    if (i>slots.length*2) break;
    ctx.strict = i>slots.length;
    ctx.idx=items.length;
    const id=pickExercise(slot,ctx)||pickExercise(SLOT(slot.m,null),ctx)||pickSecondary(slot.m,ctx); if (!id) continue;
    const it=buildItem(id,opts.goal,opts.level);
    const m=itemMinutes(it);
    if (mins+m+cool>budget && items.filter(x=>!x.warm).length>=3) break;
    items.push(it); ctx.dayUsed.add(id); ctx.progUsed.add(id); ctx.dayPat.add(EX[id].pat+'|'+EX[id].prim[0]); mins+=m;
    if (items.filter(x=>!x.warm).length>=10) break;
  }
  items.splice(0,items.length,...orderItems(items));
  if (opts.goal==='grasa'){ // circuitos: pares en superserie
    const work=items.filter(x=>!x.warm);
    for (let k=0;k+1<work.length;k+=2){ const g=uid(); work[k].superset=g; work[k+1].superset=g; work[k].rest=15; }
  }
  if ((opts.goal==='grasa'||opts.goal==='resistencia') && opts.equip){ // final de cardio
    ctx.idx=99; ctx.strict=false; const c=pickExercise(SLOT('cardio',['cardio']),ctx);

  }

    const main = items.filter(x=>!x.warm).map(x=>getEx(x.exId).prim[0]);
    const st = Object.values(EX).find(o=>o.pat==='estiramiento' && main.includes(o.prim[0])) || EX.est_isquios;
    const it=buildItem(st.id,'flexibilidad',opts.level); it.sets=[{t:'n',time:40,reps:null,kg:null}]; it.cool=true; items.push(it);
  }
  return items;
}
function generateProgram(o){
  // o: {goal, days, minutes, level, priorities[], equip}
  const level=o.level, goal=o.goal;
  const keys = goal==='flexibilidad' ? Array(Math.min(o.days,4)).fill('flex') : SPLITS[o.days]||SPLITS[3];
  const progUsed=new Set();
  const counts={};
  return keys.map((k,di)=>{
    counts[k]=(counts[k]||0)+1;
    const d=DAYS[k];
    let slots=d.s.slice();
    const reg = m => LOWER_MUSCLES.includes(m)?'lower':['abdomen','oblicuos','lumbar'].includes(m)?'core':'upper';
    (o.priorities||[]).forEach(m=>{ const pats=MUSCLE_PATTERNS[m]; if(!pats) return;
      if (reg(m)!=='core' && !k.startsWith('full') && !d.s.some(s=>s.m===m)) return; // solo en días que trabajan ese músculo
      const s=SLOT(m,pats.slice()); s.strict=true; slots.splice(2,0,s); });
    const items=fillDay(slots,{level,goal,minutes:o.minutes,equip:o.equip,progUsed});
    const sfx = keys.filter(x=>x===k).length>1 ? ' '+String.fromCharCode(64+counts[k]) : '';

}
function generateByMuscles(o){
  const slots=[];
  const maxPer=3;
  for (let r=0;r<maxPer;r++) o.muscles.forEach(m=>{ const p=(MUSCLE_PATTERNS[m]||['core'])[r]; if(p) slots.push(SLOT(m,[p])); });
  const ctx={level:o.level,goal:o.goal,equip:o.equip,dayUsed:new Set(),dayPat:new Set(),progUsed:new Set(),idx:0};
  const items=[]; let mins=0;
  if (o.minutes>=25){ const w=buildItem('mov_articular',o.goal,o.level); w.sets=[{t:'n',time:300}]; w.rest=10; w.warm=true; items.push(w); mins+=5; }
  for (const slot of slots){
    ctx.idx=items.length;
    let id=pickExercise(slot,ctx)||pickExercise(SLOT(slot.m,null),ctx)||pickSecondary(slot.m,ctx);
    if (!id) continue;
    const it=buildItem(id,o.goal,o.level); const m=itemMinutes(it);
    if (mins+m>o.minutes && items.filter(x=>!x.warm).length>=o.muscles.length) break;
    items.push(it); ctx.dayUsed.add(id); ctx.dayPat.add(EX[id].pat+'|'+EX[id].prim[0]); mins+=m;

  return items;
}
function templateItems(tpl, goal){

    let use=id;
    if (!hasEquip(EX[id])||avoided(id)){ const a=alternatives(id)[0]; if (a) use=a; }
    const it=buildItem(use, goal||tpl.g, L);

/* ---------- Análisis tras cada entrenamiento ---------- */
function weeksSince(ts){ return (Date.now()-ts)/(7*DAY); }

}
function weekKey(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }

function afterSession(session){

const maxKg = e => Math.max(0,...e.sets.map(s=>+s.kg||0));

    if (lastReps>=range[1]+3 && nx && !avoided(nx)) return {kind:'cambiar',uid:it.uid,exId:it.exId,title:`Sube de nivel: ${getEx(nx).n}`,text:`Haces ${lastReps} repeticiones limpias de ${name}. Es momento de pasar a ${getEx(nx).n}.`,why:'En calistenia se progresa con variantes más difíciles cuando superas el rango objetivo.',data:{to:nx}};

function renewRoutine(r){

    const alt=alternatives(it.exId, used)[0];

    used.push(alt); change++; lines.push(`${ex.n} → ${getEx(alt).n}`);

    case 'bajar': if (it) it.sets=s.data.sets; break;
    case 'series': if (it){ const w=it.sets.filter(x=>x.t!=='c'); it.sets.push(Object.assign({},w[w.length-1]||{t:'n',reps:10})); } break;
    case 'cambiar': if (it){ const to=getEx(s.data.to), rng=it.range||[8,12]; it.exId=to.id; it.range=to.mode==='t'?null:rng; const kg=to.mode==='p'?estimateKg(to.id,rng[0]):null; it.sets=it.sets.map(x=>({t:x.t,kg,reps:to.mode==='t'?null:rng[0],time:to.mode==='t'?(x.time||30):null})); } break;

/* ---------- Análisis semanal ---------- */

function records(){

let BB=null;
function bb(x,y,r){ if(!BB) return; r=r||0; if(x-r<BB[0])BB[0]=x-r; if(y-r<BB[1])BB[1]=y-r; if(x+r>BB[2])BB[2]=x+r; if(y+r>BB[3])BB[3]=y+r; }
const lerp2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const nrm=v=>{ const l=Math.hypot(v[0],v[1])||1; return [v[0]/l,v[1]/l]; };
const addv=(a,v,k)=>[a[0]+v[0]*k,a[1]+v[1]*k];
// cápsula cónica: dos círculos unidos por sus tangentes exteriores
function cap(a,b,ra,rb,fill,op){
  bb(a[0],a[1],ra); bb(b[0],b[1],rb);
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
  const o=op!=null&&op<1?` opacity="${op}"`:'';
  if (L<0.3) return `<circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${f1(Math.max(ra,rb))}" fill="${fill}"${o}/>`;
  const ux=dx/L, uy=dy/L, s=Math.max(-.95,Math.min(.95,(ra-rb)/L)), c=Math.sqrt(1-s*s), nx=-uy, ny=ux;
  const t1=[c*nx-s*ux, c*ny-s*uy], t2=[-c*nx-s*ux, -c*ny-s*uy];
  const p=[addv(a,t1,ra),addv(b,t1,rb),addv(b,t2,rb),addv(a,t2,ra)];
  return `<g fill="${fill}"${o}><path d="M${p.map(q=>f1(q[0])+' '+f1(q[1])).join('L')}Z"/><circle cx="${f1(a[0])}" cy="${f1(a[1])}" r="${f1(ra)}"/><circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="${f1(rb)}"/></g>`;
}
const dot=(c,r,fill,op)=>{ bb(c[0],c[1],r); return `<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(r)}" fill="${fill}"${op!=null&&op<1?` opacity="${op}"`:''}/>`; };
const seg=(a,b,w,col,op)=>{ bb(a[0],a[1],w/2); bb(b[0],b[1],w/2); return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"${op!=null&&op<1?` opacity="${op}"`:''}/>`; };
const box=(x,y,w,h,fill,rx,op,stroke)=>{ bb(x,y); bb(x+w,y+h); return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${rx??1.5}" fill="${fill}"${op!=null&&op<1?` opacity="${op}"`:''}${stroke?` stroke="${stroke}" stroke-width="1"`:''}/>`; };
// rectángulo girado (almohadillas, respaldos): centro, largo, grosor, ángulo en grados (0 = horizontal)
const rbox=(c,len,th,ang,fill,stroke)=>{ const r=ang*Math.PI/180, u=[Math.cos(r),Math.sin(r)]; const a=addv(c,u,-len/2), b=addv(c,u,len/2);
  return seg(a,b,th,stroke||fill)+(stroke?seg(a,b,th-1.6,fill):''); };
const LN=(a,b,w,op)=>seg(a,b,w,'#fff',op); // compatibilidad

/* ---- Cuerpo ---- */
function bodyDir(P){ return nrm([P.sho[0]-P.hip[0],P.sho[1]-P.hip[1]]); }
// lado "delante" del cuerpo en perfil (pecho, cara): con el torso vertical mira hacia +x
function fwd(P){ const d=bodyDir(P); return [-d[1], d[0]]; }
function legSVG(P,s,C,front){
  const hip=P['hip'+s], kn=P['knee'+s], an=P['ankle'+s], toe=P['toe'+s];
  let o=cap(hip,kn,5.1,3.9,C.skin)+cap(kn,an,3.8,2.5,C.skin);
  o+=cap(hip,lerp2(hip,kn,.42),5.6,4.7,C.shorts);
  if (toe){ const heel=addv(an,nrm([an[0]-toe[0],an[1]-toe[1]]),1.6); o+=cap(heel,toe,2.5,1.9,C.shoe); }
  else { const sx=s==='N'?1:-1; o+=cap([an[0]-sx*.5,an[1]+.6],[an[0]+sx*2.6,an[1]+1.4],2.5,2,C.shoe); }
  return o;
}
function armSVG(P,s,C){
  const sh=P['sho'+s], el=P['elbow'+s], h=P['hand'+s];
  return cap(sh,el,3.6,2.8,C.skin)+cap(sh,lerp2(sh,el,.34),4.1,3.7,C.top)+cap(el,h,2.75,2.15,C.skin)+dot(h,2.55,C.skin);
}
function torsoSVG(P,C,front,pal){
  let o='';
  if (front){
    const n=nrm([P.sho[0]-P.hip[0],P.sho[1]-P.hip[1]]);
    const sN=addv(P.shoN,n,-1), sF=addv(P.shoF,n,-1);
    o+=`<path d="M${f1(sF[0])} ${f1(sF[1])}L${f1(sN[0])} ${f1(sN[1])}L${f1(P.hipN[0]+n[1]*.8)} ${f1(P.hipN[1]-n[0]*.8)}L${f1(P.hipF[0]-n[1]*.8)} ${f1(P.hipF[1]+n[0]*.8)}Z" fill="${C.top}" stroke="${C.top}" stroke-width="6" stroke-linejoin="round"/>`;
    bb(sN[0],sN[1],4); bb(sF[0],sF[1],4);
    o+=cap(P.hipF,P.hipN,5.4,5.4,C.shorts);
    return o;
  }
  const F=fwd(P);
  const chest=addv(lerp2(P.mid,P.sho,.55),F,1.5);
  o+=cap(P.hip,P.mid,6.1,5.5,C.top)+cap(P.mid,P.sho,5.5,6.4,C.top)+dot(chest,5.6,C.top);
  o+=cap(P.hip,lerp2(P.hip,P.mid,.32),6.3,6,C.shorts)+dot(addv(P.hip,F,-1.7),5.7,C.shorts);
  return o;
}
function headSVG(P,C,pal,front){
  const hd=nrm([P.head[0]-P.sho[0],P.head[1]-P.sho[1]]);
  const neckA=addv(P.sho,hd,1), neckB=addv(P.sho,hd,4.2);
  let o=cap(neckA,neckB,2.5,2.3,C.skin)+dot(P.head,SEG.HR,C.skin);
  if (pal.band){
    const pr=[-hd[1],hd[0]], c=addv(P.head,hd,2.2);
    o+=seg(addv(c,pr,-5.7),addv(c,pr,5.7),2.3,pal.band);
    if (!front){ const F=fwd(P); const back=addv(c,F,-5.6); o+=seg(back,addv(addv(back,F,-3),hd,-2.2),1.6,pal.band)+seg(back,addv(addv(back,F,-2.4),hd,-4),1.6,pal.band); }
  }
  return o;
}

/* ---- Músculos que trabajan (Premium) ---- */
function sideOff(a,b,c,k,fb){ // desplaza hacia el lado contrario a c respecto de la línea a-b (fb: lado de reserva si está recto)
  const u=nrm([b[0]-a[0],b[1]-a[1]]), n=[-u[1],u[0]]; let d=(c[0]-a[0])*n[0]+(c[1]-a[1])*n[1];
  if (Math.abs(d)<1.2 && fb) d=-(fb[0]*n[0]+fb[1]*n[1]); const s=d>0?-1:1; return [n[0]*s*k,n[1]*s*k];
}
function muscleSVG(ex,P,t,pal){
  if (!pal.hi) return '';
  const front=t.v==='front', F=front?[0,0]:fwd(P), col=pal.hi;
  const lv={}; (ex.prim||[]).forEach(m=>lv[m]=.82); (ex.sec||[]).forEach(m=>{ if(!lv[m]) lv[m]=.36; });
  let o='';
  const sides=front?['N','F']:['N'];
  for (const m in lv){ const op=lv[m];
    if (m==='pecho'){ if(front){ const c=lerp2(P.mid,P.sho,.62); o+=dot(lerp2(c,P.shoN,.45),3.8,col,op)+dot(lerp2(c,P.shoF,.45),3.8,col,op); } else o+=dot(addv(lerp2(P.mid,P.sho,.62),F,3.4),3.7,col,op); }
    else if (m==='dorsales'&&!front) o+=cap(addv(lerp2(P.mid,P.sho,.05),F,-3.6),addv(lerp2(P.mid,P.sho,.85),F,-3.8),2.6,3.4,col,op);
    else if (m==='trapecio'){ const hd=lerp2(P.sho,P.head,.35); o+=cap(addv(P.sho,F,-2.4),addv(hd,F,-1.6),2.8,2.1,col,op); }
    else if (m==='lumbar'&&!front) o+=cap(addv(P.hip,F,-3.8),addv(P.mid,F,-3.6),2.4,2.4,col,op);
    else if ((m==='abdomen'||m==='oblicuos')&&!(m==='oblicuos'&&lv.abdomen)) o+=front?cap(lerp2(P.hip,P.mid,.25),lerp2(P.mid,P.sho,.35),3.4,3.4,col,op):cap(addv(lerp2(P.hip,P.mid,.25),F,3.6),addv(lerp2(P.mid,P.sho,.3),F,3.8),2.3,2.5,col,op);
    else if (m==='gluteos'&&!front) o+=dot(addv(P.hip,F,-2.6),4.3,col,op);
    else for (const s of sides){
      const sh=P['sho'+s], el=P['elbow'+s], h=P['hand'+s], hp=P['hip'+s], kn=P['knee'+s], an=P['ankle'+s];
      if (m==='hombros') o+=dot(sh,3.7,col,op);
      else if (m==='biceps'){ const d=front?[0,0]:sideOff(sh,el,h,-1.1,[-F[0],-F[1]]); o+=cap(addv(lerp2(sh,el,.22),d,1),addv(lerp2(sh,el,.85),d,1),2.2,1.9,col,op); }
      else if (m==='triceps'){ const d=front?[0,0]:sideOff(sh,el,h,1.1,[-F[0],-F[1]]); o+=cap(addv(lerp2(sh,el,.22),d,1),addv(lerp2(sh,el,.85),d,1),2.2,1.9,col,op); }
      else if (m==='antebrazos') o+=cap(lerp2(el,h,.12),lerp2(el,h,.7),2.1,1.7,col,op);
      else if (m==='cuadriceps'){ const d=front?[0,0]:sideOff(hp,kn,an,1.4,F); o+=cap(addv(lerp2(hp,kn,.2),d,1),addv(lerp2(hp,kn,.88),d,1),3.4,2.6,col,op); }
      else if (m==='isquios'){ const d=front?[0,0]:sideOff(hp,kn,an,-1.4,F); o+=cap(addv(lerp2(hp,kn,.2),d,1),addv(lerp2(hp,kn,.88),d,1),3.2,2.5,col,op); }
      else if (m==='aductores'||m==='abductores') o+=cap(lerp2(hp,kn,.2),lerp2(hp,kn,.8),2.9,2.3,col,op*.9);
      else if (m==='gemelos'){ const d=front?[0,0]:sideOff(kn,an,P['toe'+s]||an,1.2); o+=cap(addv(lerp2(kn,an,.15),d,1),addv(lerp2(kn,an,.55),d,1),2.8,2.1,col,op); }
    }
  }
  return o?`<g style="mix-blend-mode:normal">${o}</g>`:'';
}

/* ---- Equipos fijos (bancos, máquinas, barras, cardio). Cada uno se dibuja con la paleta y puede seguir un punto del cuerpo ---- */
const PT=(P,v)=>typeof v==='string'?P[v]:v;
function pulley(x,y,from,pal,col){ // columna de polea con su cable (la columna se aparta del cuerpo si la polea queda encima)
  let cx=x; if (from && Math.abs(x-from[0])<22) cx=x+(x>=from[0]?1:-1)*(24-Math.abs(x-from[0]));
  const top=y<30?Math.min(y-6,-4):Math.max(-4,y-26);
  let o=box(cx-2.6,top,5.2,FLOOR_Y-top,pal.frame,1.5,pal.mono?.35:1);
  if (cx!==x) o+=seg([cx,y-3],[x,y-3],3,pal.frame,pal.mono?.5:1);
  o+=dot([x,y],3.4,pal.steelD,pal.mono?.8:1)+dot([x,y],1.3,pal.steel);
  if (from) o+=seg([x,y],from,1.1,pal.cable,.9);
  return o;
}
function stack(x,pal,top){ // torre de discos de una máquina
  const t=top??18; let o=box(x-7,t,14,FLOOR_Y-t,pal.frame,2,pal.mono?.3:1);
  for(let y=FLOOR_Y-5;y>FLOOR_Y-30;y-=4.2) o+=box(x-5.5,y,11,3.4,pal.plate,1,pal.mono?.5:1,pal.mono?null:pal.plateE);
  return o;
}
function seatM(x,y,pal,back){ // asiento de máquina con respaldo (back: ángulo del respaldo, 0 = vertical)
  const b=back??8; const r=b*Math.PI/180;
  let o=seg([x,y+3],[x,FLOOR_Y],3,pal.frame,pal.mono?.45:1)+seg([x-9,FLOOR_Y],[x+9,FLOOR_Y],3,pal.frame,pal.mono?.45:1);
  o+=rbox([x+1,y],18,6,0,pal.pad,pal.padE);
  if (back!==false){ const top=[x-9-Math.sin(r)*30, y-Math.cos(r)*30]; o+=seg([x-9,y-2],top,6,pal.padE)+seg([x-9,y-2],top,4.4,pal.pad); }
  return o;
}
function lever(piv,end,pal,kind){ // brazo de palanca desde el eje hasta la mano o el pie
  let o=seg(piv,end,3,pal.steelD)+dot(piv,2.6,pal.frame)+dot(piv,1,pal.steel);
  if (kind==='r') o+=dot(end,3.4,pal.pad)+dot(end,1.5,pal.padE);
  else o+=seg(addv(end,[0,1],-2.2),addv(end,[0,1],2.2),2.4,pal.steel);
  return o;
}
function drawProps(t, P, pal, ex){
  pal=pal||PAL.mono; let s='';
  const mo=pal.mono?.5:1;
  (t.p||[]).forEach(pr=>{
    const [k,...a]=pr;
    switch(k){
      case 'ln': s+=seg([a[0],a[1]],[a[2],a[3]],3,pal.frame,pal.mono?.55:1); break;
      case 'mat': s+=box(a[0],FLOOR_Y-1.2,a[1]-a[0],2.2,pal.mat,1,pal.mono?.35:.55); break;
      case 'bench': { const [x0,x1,y]=a; s+=seg([x0+5,y+3],[x0+5,FLOOR_Y],3,pal.frame,mo)+seg([x1-5,y+3],[x1-5,FLOOR_Y],3,pal.frame,mo)+seg([x0+2,FLOOR_Y],[x0+9,FLOOR_Y],3,pal.frame,mo)+seg([x1-9,FLOOR_Y],[x1-2,FLOOR_Y],3,pal.frame,mo)+box(x0,y-1,x1-x0,5,pal.pad,2.5,pal.mono?.6:1,pal.mono?null:pal.padE); break; }
      case 'incl': { const [x0,y0,x1,y1]=a; s+=seg([x0,y0],[x1,y1],6,pal.padE)+seg([x0,y0],[x1,y1],4.4,pal.pad,pal.mono?.6:1)+seg([x0,y0+2],[x0,FLOOR_Y],3,pal.frame,mo)+seg([(x0+x1)/2,(y0+y1)/2+2],[(x0+x1)/2+4,FLOOR_Y],3,pal.frame,mo); break; }
      case 'box': s+=box(a[0],a[1],a[2],a[3],pal.pad,2,pal.mono?.35:1,pal.mono?null:pal.padE); break;
      case 'wall': { const top=a[1]??10; s+=box(a[0]-1,top,3,FLOOR_Y-top,pal.frame,0,pal.mono?.45:.9); break; }
      case 'lat': { // jalón: columna delante con la pila de discos, brazo superior y polea encima de la cabeza
        const [cx,py,px]=a; s+=box(cx-6,-6,12,FLOOR_Y+6,pal.frame,2,pal.mono?.3:1)+seg([cx,-4],[px,-4],3,pal.frame,pal.mono?.5:1)+dot([px,-2],3,pal.steelD)+seg([px,-2],P.handN,1.1,pal.cable,.9)+seg(addv(P.handN,[1,0],-4),addv(P.handN,[1,0],4),2.6,pal.steel);
        for(let y=FLOOR_Y-5;y>FLOOR_Y-26;y-=4.2) s+=box(cx-4.5,y,9,3.4,pal.plate,1,pal.mono?.5:1,pal.mono?null:pal.plateE); break; }
      case 'kneepad': s+=rbox([a[0],a[1]],10,5,0,pal.pad,pal.padE)+seg([a[0]+5,a[1]],[a[2]||a[0]+14,a[1]],2.4,pal.frame,mo); break;
      case 'mach': { // máquina de palanca: asiento + pila + palanca desde el eje hasta la mano
        const [sx,sy,px,py,back]=a; s+=seatM(sx,sy,pal,back??8)+stack(sx-26,pal,30)+seg([sx-20,30],[px,py],3,pal.frame,mo)+lever([px,py],P.handN,pal); break; }
      case 'tbar': { const [px]=a; const h=P.handN; s+=seg([px,FLOOR_Y-1.5],h,3,pal.steelD)+dot([px,FLOOR_Y-1.5],2.4,pal.frame)+dot(addv(h,[1,0],5),8,pal.plate,pal.mono?.3:1)+dot(addv(h,[1,0],5),1.4,pal.steel)+seg(addv(h,[0,1],-3),addv(h,[0,1],3),2.2,pal.steel); break; }
      case 'pbar': { const [x0,x1,y]=a; s+=seg([x0,y],[x1,y],2.6,pal.steel)+seg([x0,y],[x0,FLOOR_Y],3,pal.frame,mo)+seg([x1,y],[x1,FLOOR_Y],3,pal.frame,mo); break; }
      case 'par': { const [x,y]=a; s+=seg([x-20,y],[x+16,y],3,pal.steel)+seg([x-16,y],[x-16,FLOOR_Y],3,pal.frame,mo)+seg([x+12,y],[x+12,FLOOR_Y],3,pal.frame,mo); break; }
      case 'plt': { const [x,y]=a; s+=seg([x-6,y],[x+6,y],2.4,pal.steel)+seg([x-5,y],[x-7,FLOOR_Y],2,pal.frame,mo)+seg([x+5,y],[x+7,FLOOR_Y],2,pal.frame,mo); break; } // paralette
      case 'seat': s+=seatM(a[0],a[1],pal,a[2]); break;
      case 'chair': { const [x,y]=a; s+=rbox([x+9,y],18,4.5,0,pal.pad)+seg([x,y],[x,y-28],4,pal.pad)+seg([x+2,y],[x+2,FLOOR_Y],2.5,pal.frame,mo)+seg([x+16,y],[x+16,FLOOR_Y],2.5,pal.frame,mo); break; }
      case 'table': { const [x,y]=a; s+=seg([x-2,y],[x+40,y],4,pal.pad)+seg([x+2,y],[x+2,FLOOR_Y],2.5,pal.frame,mo)+seg([x+36,y],[x+36,FLOOR_Y],2.5,pal.frame,mo); break; }
      case 'rack': { const [x,y]=a; s+=seg([x,-8],[x,FLOOR_Y],3.4,pal.frame,mo)+seg([x-4,FLOOR_Y],[x+10,FLOOR_Y],3,pal.frame,mo)+seg([x,y],[x+5,y],2.4,pal.steelD); break; }
      case 'smith': { const x=a[0]; s+=seg([x-3,-10],[x-3,FLOOR_Y],2.2,pal.steelD,pal.mono?.5:1)+seg([x+3,-10],[x+3,FLOOR_Y],2.2,pal.steelD,pal.mono?.5:1)+seg([x-8,-10],[x+8,-10],3,pal.frame,mo); break; }
      case 'stack': s+=stack(a[0],pal,a[1]); break;
      case 'pull': s+=pulley(a[0],a[1],P[a[2]||'handN'],pal); break;
      case 'lever': s+=lever([a[0],a[1]],P[a[2]],pal,a[3]); break;
      case 'pad': s+=rbox([a[0],a[1]],a[2],a[3],a[4]||0,pal.pad,pal.padE); break;
      case 'padP': { const c=addv(P[a[0]],[a[1]||0,a[2]||0],1); s+=rbox(c,a[3]||8,5,a[4]||0,pal.pad,pal.padE); break; } // almohadilla que sigue un punto
      case 'hangW': { const c=lerp2(P.handN,P.handF,.5), b=[c[0],c[1]+22]; s+=seg(addv(c,[1,0],-5),addv(c,[1,0],5),3,pal.steel)+seg(c,b,1.2,pal.cable)+dot(b,6,pal.plate,pal.mono?.4:1)+dot(b,1.2,pal.steel); break; }
      case 'plateOn': { const F=fwd(P), c=addv(lerp2(P.mid,P.sho,.2),F,-7); s+=rbox(c,15,3.6,Math.atan2(P.sho[1]-P.hip[1],P.sho[0]-P.hip[0])*180/Math.PI,pal.plate,pal.plateE); break; }
      case 'mast': s+=seg([a[0],-8],[a[0],FLOOR_Y],3.4,pal.frame,mo)+seg([a[0]-8,FLOOR_Y],[a[0]+8,FLOOR_Y],3,pal.frame,mo); break;
      case 'crank': { const c=[a[0],a[1]]; s+=seg(c,[a[0]+4,FLOOR_Y],3,pal.frame,mo)+`<circle cx="${c[0]}" cy="${c[1]}" r="${a[2]||6}" fill="none" stroke="${pal.steelD}" stroke-width="1.8"/>`+seg(c,P.handN,2,pal.steel)+dot(c,1.8,pal.steel); bb(c[0],c[1],8); break; }
      case 'beltw': { const c=P.hip, b=[c[0]+2,c[1]+20]; s+=seg(c,b,1.4,pal.cable)+dot(b,6.5,pal.plate,pal.mono?.4:1)+dot(b,1.3,pal.steel); break; }
      case 'bpad': { const F=fwd(P), d=bodyDir(P); const a0=addv(addv(P.hip,F,-5.4),d,a[0]??-2), b0=addv(addv(P.sho,F,-5.4),d,a[1]??6); s+=seg(a0,b0,6.4,pal.padE)+seg(a0,b0,4.8,pal.pad,pal.mono?.6:1); break; }

        const b=P.sho, h=P.hip; s+=seg(addv(h,[-1,0],2),addv(b,[-1,0],2),5.5,pal.padE)+seg(addv(h,[-1,0],2),addv(b,[-1,0],2),4,pal.pad)+dot(b,3,pal.pad); break; }
      case 'tread': s+=box(14,FLOOR_Y-7,68,6,pal.pad,3,pal.mono?.45:1,pal.mono?null:pal.padE)+seg([78,FLOOR_Y-6],[74,40],3,pal.frame,mo)+seg([66,40],[80,40],3.5,pal.steelD)+seg([70,40],[74,34],3,pal.frame,mo); break;

/* ============ Motor 3D de animaciones (0.7) ============
   Mundo: x = hacia donde mira la persona, y = arriba (suelo en y=0), z = hacia su derecha. Unidades ≈ 2 cm.
   Cada ejercicio 3D se define como pose(u) y kit(u,B): u va de 0 (inicio) a 1 (final del recorrido).
   La pose se describe con la pelvis, la inclinación del tronco y los puntos donde están manos y pies;
   codos y rodillas se calculan con cinemática inversa 3D, así las manos no se despegan de las asas. */
const D3={TH:19.5,SH:19,UA:14.5,FA:13.5,T1:13,T2:13,NK:3.2,HR:6.2,SW:7.6,HW:4.8,FT:7,ANK:5};
const v3=(x,y,z)=>[x,y,z], va=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], vs=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], vk=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const vd=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], vl=a=>Math.hypot(a[0],a[1],a[2]), vn=a=>{ const l=vl(a)||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const vx=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], vm=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const vp=(a,...ks)=>{ let r=a.slice(); for(let i=0;i<ks.length;i+=2) r=va(r,vk(ks[i],ks[i+1])); return r; }; // a + v1*k1 + v2*k2…
const RAD=Math.PI/180, UP=[0,1,0];
function rotAx(v,ax,deg){ const a=deg*RAD, c=Math.cos(a), s=Math.sin(a), k=vn(ax); return va(va(vk(v,c),vk(vx(k,v),s)),vk(k,vd(k,v)*(1-c))); }
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const mix=(a,b,u)=>a+(b-a)*u;
// curva suave (Catmull-Rom) que pasa por todos los puntos: u de 0 a 1 recorre la lista
function crv(pts,u){ const n=pts.length-1; const x=Math.min(n-1e-6,Math.max(0,u*n)), i=Math.floor(x), t=x-i;
  const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(n,i+2)]; const t2=t*t, t3=t2*t;

/* esqueleto completo a partir de la pose */
function body3(p){

  let d=rotAx(UP,r,-(p.lean||0)); if (p.side) d=rotAx(d,f,p.side);
  if (p.roll){ r=rotAx(r,d,p.roll); f=rotAx(f,d,p.roll); } // tumbado de lado: el cuerpo gira sobre su eje

    const ep=p['e'+s]||vp([0,0,0],f,-.45,r,.65*sg,UP,-.45);

/* cámara: yaw gira alrededor del eje vertical (0 = de perfil desde su derecha, 90 = de frente), pitch = desde arriba */
function cam3(c){ const y=(c&&c.yaw||0)*RAD, pt=(c&&c.pitch||0)*RAD; const cy=Math.cos(y), sy=Math.sin(y), cp=Math.cos(pt), sp=Math.sin(pt);
  return p=>{ const x1=p[0]*cy-p[2]*sy, z1=p[0]*sy+p[2]*cy; return [x1, FLOOR_Y-(p[1]*cp-z1*sp), z1*cp+p[1]*sp]; }; }
/* lista de piezas con profundidad (se dibujan de atrás hacia delante) */
function R3(pr){ this.pr=pr; this.it=[]; }
R3.prototype.add=function(dep,s){ this.it.push([dep+(this._bias||0),s]); };
// lo que se dibuja dentro de under() queda siempre detrás del cuerpo (bancos, colchonetas, almohadillas bajo el tronco)
R3.prototype.under=function(fn){ const b=this._bias; this._bias=-2e4; try{ fn(); } finally { this._bias=b; } };

// caja orientada: centro, ejes (unitarios) y medias medidas

// Las piernas se construyen desde los pies (que nunca se mueven): ángulo de tibia, de muslo y del tronco por fotogramas clave
// suavizados. La barra no empuja al cuerpo: los brazos cuelgan rectos del hombro y la barra se desliza pegada a tibias y muslos.
function legSurf(B,y,zc,zh){ let fx=-1e9; ['R','L'].forEach(s=>{ [[B['hip'+s],B['knee'+s],5.6,4.1],[B['knee'+s],B['ank'+s],3.9,2.6]].forEach(([a,b,r0,r1])=>{ for(let i=0;i<=40;i++){ const t=i/40, p=vm(a,b,t), r=mix(r0,r1,t), dy=p[1]-y;
  if (Math.abs(dy)>=r) continue; if (zh!=null && Math.abs(p[2]-zc)>r+zh) continue; fx=Math.max(fx,p[0]+Math.sqrt(r*r-dy*dy)); } }); }); return fx; }
// mano en contacto con las piernas: el brazo recto gira desde el hombro hasta que la barra roza la pierna
function hugArm(B,S,o){ const L=o.arm||27.3, clr=o.clr??1.4; const H=ph=>[S[0]+L*Math.sin(ph),S[1]-L*Math.cos(ph)];
  const g=ph=>{ const h=H(ph); const f=legSurf(B,h[1]-(o.cy||0),o.zc||0,o.zh); return h[0]-(f<-1e8?h[0]-99:f+clr); };
  let lo=-32*RAD, hi=22*RAD, ph; const h0=H(0);
  if (legSurf(B,h0[1]-(o.cy||0),o.zc||0,o.zh)<-1e8) ph=o.X0!=null?-1:0; else if (g(lo)>=0) ph=lo; else if (g(hi)<=0) ph=hi;
  else { for(let i=0;i<30;i++){ const m=(lo+hi)/2; if (g(m)>0) hi=m; else lo=m; } ph=hi; }
  // la barra sigue una línea casi vertical (o.X0); solo se acerca más si las piernas no estorban; nunca entra en ellas
  if (o.X0!=null){ const pl=Math.asin(Math.max(-.95,Math.min(.95,(o.X0-S[0])/L))); const k=2.5*RAD; ph=(ph+pl+Math.sqrt((ph-pl)**2+k*k))/2; }
  return H(ph); }

    const ank=[2,D3.ANK]; const kn=[ank[0]+SHs*Math.sin(s*RAD),ank[1]+SHs*Math.cos(s*RAD)]; const hip=[kn[0]-THs*Math.sin(t*RAD),kn[1]+THs*Math.cos(t*RAD)];

    const B0=body3(p); const hz=o.hz??12; const hR=hugArm(B0,B0.shoR,o.X?Object.assign({},o,{X0:mix(o.X[0],o.X[1],e)}):o);

function stepLunge(id,mode){ def3(id,{cams:mode==='lat'?[CAMF,CAM34]:[CAMP,CAM34],loop:true,tm:[4400],ico:.22,
  pose:u=>{ const half=u<.5?0:1, s=(u%.5)*2; const L=half?'L':'R', T=half?'R':'L', gl=half?-1:1;
    const out=s<.22?ease(s/.22):s<.78?1:1-ease((s-.78)/.22), dn=s<.22?0:s<.5?ease((s-.22)/.28):s<.78?1-ease((s-.5)/.28):0, lift=(s<.22||s>.78)?Math.sin(Math.PI*(s<.22?s/.22:(s-.78)/.22)):0;
    const p={pel:[0,41,0],lean:2,head:0}; let stepX=0, stepZ=0;
    if (mode==='fwd') stepX=34*out; else if (mode==='back') stepX=-34*out; else stepZ=gl*22*out;
    p['f'+L]=[1+stepX,D3.ANK+4*lift,gl*6.5+stepZ]; p['f'+T]=[1,D3.ANK,-gl*6.5];
    if (mode==='lat'){ p.pel=[-10*dn,mix(41,27,dn),gl*14*out]; p.lean=mix(2,30,dn); p['k'+L]=[1,0,gl*.5]; p['k'+T]=[1,0,-gl*.1]; p['ff'+L]=rotAx([1,0,0],UP,-gl*20); }
    else { const fx=p['f'+L][0], bx=p['f'+T][0]; p.pel=[(mode==='fwd'?fx*.48:bx+(fx-bx)*.0+(stepX*.5)),mix(41,24,dn),0]; if (mode==='back'){ p.pel[0]=1+stepX*.5; p['f'+L]=[1,D3.ANK,gl*6.5]; p['f'+T]=[1+stepX,D3.ANK+4*lift,-gl*6.5]; p['t'+T]=mix(0,38,out); p['k'+T]=[1,-.5*out,-gl*.1]; p['k'+L]=[1,0,gl*.1]; }
      else { p.pel[0]=1+stepX*.5; p['t'+T]=mix(0,38,out); p['k'+T]=[1,-.5*out,-gl*.1]; p['k'+L]=[1,0,gl*.1]; } }
    capPel(p); return withHands(p,handsHip); },
  kit:()=>{}}); }

function perroP(){ const hip=[-30,42,0], H=[0,2.6,0]; const d=vn(vs(H,hip)); const lean=Math.atan2(d[0],d[1])/RAD; return {pel:hip,lean,head:-8,fR:[-39.5,D3.ANK,7],fL:[-39.5,D3.ANK,-7],kR:[1,0,0],kL:[1,0,0]}; }
holdDef('yoga_perro',[CAMP,CAM34],u=>{ const p=perroP(); p.pel=vp(p.pel,UP,mix(0,.6,u)); return withHands(p,(B,g)=>[[0,2.6,g*11.5],vn(V(UP,1,[0,0,1],g*.4))]); },(R,u,B,pal)=>matK(R,pal,-18,70,30));
// niño: sentado sobre los talones, el tronco sobre los muslos, frente en el suelo y brazos estirados delante
holdDef('yoga_nino',[CAMP,CAM34],u=>{ const p={pel:[-15,mix(12.5,13,u),0],lean:mix(104,102,u),bk:8,head:10,kR:[0,-1,0],kL:[0,-1,0]}; G.forEach(g=>{ const s=SD(g); p['f'+s]=[-19.5,4,g*5.5]; p['ff'+s]=[-1,0,0]; p['fu'+s]=[0,-1,0]; }); p.kR=[1,0,.3]; p.kL=[1,0,-.3];
  return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],[1,0,0],25.5,UP,-(B['sho'+SD(g)][1]-2.6),[0,0,1],g*1),vn(V(UP,1,[0,0,1],g*.3))]); },(R,u,B,pal)=>matK(R,pal,-4,70,30));
// cobra: boca abajo, cadera en el suelo; los brazos empujan y el pecho se eleva
holdDef('yoga_cobra',[CAMP,CAM34],u=>{ const p=proneP({lean:mix(68,66,u),bk:-24,head:-12}); return withHands(p,(B,g)=>{ const S=B['sho'+SD(g)]; return [[S[0]+2,2.6,g*11],vn(V([1,0,0],-1,[0,0,1],g*.2,UP,.3))]; }); },(R,u,B,pal)=>matK(R,pal,-4,90,30));
// guerrero I: zancada con la rodilla delantera a 90°, la pierna de atrás estirada con el pie girado; brazos arriba
holdDef('yoga_guerrero1',[CAMP,CAM34],u=>{ const p={pel:[0,mix(29.5,30,u),0],lean:2,head:-4,fR:[22,D3.ANK,7],fL:[-31,D3.ANK,-8],kR:[1,0,.1],kL:[1,0,-.2],ffL:rotAx([1,0,0],UP,45)}; return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],UP,26.4,B.r,-g*2),vn(V(B.r,g,B.f,-.2))]); },(R,u,B,pal)=>matK(R,pal,-4,80,30));
// guerrero II: piernas muy abiertas, la delantera a 90°, tronco de frente y brazos estirados en línea
holdDef('yoga_guerrero2',[{yaw:-90+35,pitch:12},{yaw:-90,pitch:8}].map(c=>({yaw:c.yaw+90,pitch:c.pitch})),u=>{ const p={pel:[-1.9,mix(26.6,27,u),0],lean:0,yaw:-90,head:0,fR:[-26,D3.ANK,0],fL:[34.4,D3.ANK,0],kR:[-1,0,0],kL:[0,0,1],ffR:[-1,0,0],ffL:vn([.3,0,1])};
  return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],B.r,g*26.5),vn(V(UP,-1,B.f,-.2))]); },(R,u,B,pal)=>matK(R,pal,4,90,30));
// triángulo: piernas abiertas y rectas, el tronco se inclina hacia la pierna de delante; una mano a la espinilla, la otra al techo
holdDef('yoga_triangulo',[{yaw:0,pitch:10},{yaw:30,pitch:14}],u=>{ const p={pel:[4,40.4,0],lean:0,yaw:-90,side:mix(58,61,u),head:0,fR:[-24,D3.ANK,0],fL:[30,D3.ANK,0],kR:[0,0,1],kL:[0,0,1],ffR:[-1,0,0],ffL:vn([.3,0,1])}; capPel(p);
  return withHands(p,(B,g)=>g>0?[vm(B.kneeR,B.ankR,.4),vn(V(B.f,-.4,UP,.3))]:[vp(B.shoL,UP,26.5),vn(V([0,0,1],1))]); },(R,u,B,pal)=>matK(R,pal,4,80,30));
// árbol: sobre la pierna izquierda; la planta derecha en el muslo izquierdo y la rodilla hacia fuera; manos juntas arriba

  return withHands(p,(B,g)=>{ const S=vm(B.shoR,B.shoL,.5); return [vp(S,UP,26.6,B.r,g*1.4),vn(V(B.r,g,B.f,-.2))]; }); });
// silla: rodillas dobladas y cadera atrás; brazos arriba en línea con la espalda

  return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],B.d2,26.4,B.r2,-g*1.5),vn(V(B.r2,g,B.nf,-.2))]); });
// paloma: pierna delantera doblada cruzada delante, la de atrás estirada en el suelo; tronco erguido, manos a los lados
holdDef('yoga_paloma',[CAM34,CAMP],u=>{ const p={pel:[0,mix(10.5,11,u),0],lean:-2,head:-4}; const B0=body3(p); legKA(p,'R',B0.hipR,V([1,0,0],.78,[0,0,1],.55,UP,-.25),V([1,0,0],.25,[0,0,1],-.97,UP,-.02)); p.fL=vp(B0.hipL,[1,0,0],-37.4,UP,-6.5); p.kL=[0,-1,0]; p.ffL=[-1,0,0]; p.fuL=[0,-1,0];
  return withHands(p,(B,g)=>[vp(B['hip'+SD(g)],[1,0,0],5,[0,0,1],g*9,UP,-8),vn(V([1,0,0],-1,[0,0,1],g*.4))]); },(R,u,B,pal)=>matK(R,pal,0,90,40));
// pinza: sentado con las piernas estiradas, el tronco se pliega hacia delante y las manos van a los pies
holdDef('yoga_pinza',[CAMP,CAM34],u=>{ const p={pel:[0,6.8,0],lean:mix(58,61,u),bk:16,head:12,fR:[37.4,5.3,5],fL:[37.4,5.3,-5],kR:[0,1,0],kL:[0,1,0],ffR:vn([.15,1,0]),fuR:vn([-1,.15,0]),ffL:vn([.15,1,0]),fuL:vn([-1,.15,0])};
  return withHands(p,(B,g)=>[vp(B['ank'+SD(g)],[1,0,0],-3,UP,3.5),vn(V(UP,-1,[0,0,1],g*.5))]); },(R,u,B,pal)=>matK(R,pal,6,70,30));
// torsión tumbada: rodillas juntas caídas hacia un lado, brazos en cruz en el suelo
holdDef('yoga_torsion',[CAMT,CAM34],u=>{ const p=supP({head:2}); const dz=mix(-15,-16,u); G.forEach(g=>{ const s=SD(g), hip=vp(p.pel,[0,0,1],g*D3.HW); const K=[hip[0]+14.5,g>0?9:5,dz+g*2.2]; const A=[hip[0]+10,g>0?7:3.5,dz-14+g*2.2]; p['f'+s]=A; p['k'+s]=vn(vs(K,vm(hip,A,.5))); });
  return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],[0,0,1],g*26.4,UP,-(B['sho'+SD(g)][1]-2.4)),vn(V(UP,1))]); },(R,u,B,pal)=>matK(R,pal,-6,80,60));
// barco: equilibrio sobre los isquiones, piernas rectas arriba y tronco atrás formando una V; brazos al frente
holdDef('yoga_barco',[CAMP,CAM34],u=>{ const lean=-mix(40,42,u); const p={pel:[0,6.6,0],lean,head:12}; const a=mix(48,50,u)*RAD; G.forEach(g=>{ const s=SD(g), hip=vp(p.pel,[0,0,1],g*D3.HW); p['f'+s]=vp(hip,[1,0,0],37.6*Math.cos(a),UP,37.6*Math.sin(a),[0,0,1],-g*1.5); p['k'+s]=vn(V(UP,Math.cos(a),[1,0,0],-Math.sin(a))); p['ff'+s]=vn(V(UP,Math.cos(a),[1,0,0],-Math.sin(a))); p['fu'+s]=vn(V([1,0,0],-Math.cos(a),UP,-Math.sin(a))); });
  return withHands(p,(B,g)=>[vp(B['sho'+SD(g)],[1,0,0],26.4,[0,0,1],-g*1),vn(V(UP,-1,[0,0,1],g*.4))]); },(R,u,B,pal)=>matK(R,pal,6,60,30));
// cuervo: manos en el suelo, rodillas apoyadas en la parte de atrás de los brazos y los pies despegados
holdDef('yoga_cuervo',[CAMP,CAM34],u=>{ const p={pel:[-6,mix(25,25.6,u),0],lean:mix(72,74,u),bk:12,head:-22}; const B0=body3(p); G.forEach(g=>{ const s=SD(g), hip=B0['hip'+s]; const K=[hip[0]+14,hip[1]-3.5,g*10.5]; const A=[hip[0]-3,14.5,g*4]; p['f'+s]=A; p['k'+s]=vn(vs(K,vm(hip,A,.5))); p['ff'+s]=vn([-.6,-.8,0]); });
  return withHands(p,(B,g)=>[[13,2.6,g*10],vn(V([1,0,0],-1,UP,.4,[0,0,1],g*.35))]); },(R,u,B,pal)=>matK(R,pal,0,60,30));

/* --- SALUDO AL SOL (secuencia encadenada) --- */
// Cada postura es una pose completa con manos y codos; se encadenan suavemente y los pies se levantan al dar el paso atrás o adelante
function poseHands(p,fn){ return withHands(p,fn); }
const SAL=(()=>{ const hx=16;
  const prayer=()=>poseHands(standP(),(B,g)=>[vp(B.neck,B.nf,8,B.d2,-9,B.r2,g*1.5),vn(V(UP,-1,B.r,g*1,B.f,-.3))]);
  const up=()=>poseHands(standP({bk:-14,head:-14}),(B,g)=>[vp(B['sho'+SD(g)],B.d2,26.4,B.r2,-g*2),vn(V(B.r2,g,B.nf,-.2))]);
  const fold=()=>{ const p={pel:[-9,40.4,0],lean:118,bk:22,head:14,fR:[1,D3.ANK,6],fL:[1,D3.ANK,-6],kR:[1,0,.05],kL:[1,0,-.05]}; return poseHands(p,(B,g)=>[[9,2.6,g*10],vn(V([1,0,0],-1,[0,0,1],g*.3,UP,.2))]); };
  const half=()=>{ const p={pel:[-9,40.6,0],lean:88,head:-12,fR:[1,D3.ANK,6],fL:[1,D3.ANK,-6],kR:[1,0,.05],kL:[1,0,-.05]}; return poseHands(p,(B,g)=>[vp(B['knee'+SD(g)],UP,-6,[1,0,0],4),vn(V([1,0,0],-1,[0,0,1],g*.4))]); };
  const S0=shoC(lineP([-46,7.9,0],20.6)); const H=[S0[0],2.6];
  const plank=()=>poseHands(lineP([-46,7.9,0],20.6),(B,g)=>[[H[0],2.6,g*11],vn(V([1,0,0],-.7,[0,0,1],g*.5,UP,.3))]);
  const cobra=()=>{ const p=proneP({pel:[H[0]-24,6.4,0],lean:66,bk:-22,head:-12}); G.forEach(g=>{ const s=SD(g); p['f'+s]=[H[0]-24-37.6,3.4,g*6]; }); return poseHands(p,(B,g)=>[[H[0],2.6,g*11],vn(V([1,0,0],-1,[0,0,1],g*.2,UP,.3))]); };
  const dog=()=>{ const hip=[H[0]-30,42,0], Hh=[H[0],2.6,0]; const d=vn(vs(Hh,hip)); const p={pel:hip,lean:Math.atan2(d[0],d[1])/RAD,head:-8,fR:[H[0]-39.5,D3.ANK,7],fL:[H[0]-39.5,D3.ANK,-7],kR:[1,0,0],kL:[1,0,0]}; return poseHands(p,(B,g)=>[[H[0],2.6,g*11],vn(V(UP,1,[0,0,1],g*.4))]); };
  return {prayer,up,fold,half,plank,cobra,dog}; })();
def3('yoga_saludo',{cams:[CAMP,CAM34],loop:true,tm:[16000],ico:.08,
  pose:u=>{ const S=SAL; const seq=[S.prayer(),S.up(),S.fold(),S.half(),S.plank(),S.cobra(),S.dog(),S.half(),S.fold(),S.up(),S.prayer()];
    const n=seq.length-1, x=u*n, i=Math.min(n-1,Math.floor(x)), t=ease(x-i); const a=seq[i], b=seq[i+1]; const p=blendP(a,b,t);
    ['eR','eL','kR','kL','ffR','ffL','fuR','fuL'].forEach(k=>{ if (p[k]&&vl(p[k])>1e-6) p[k]=vn(p[k]); });
    G.forEach(g=>{ const s=SD(g); const dx=Math.abs(a['f'+s][0]-b['f'+s][0]); if (dx>8){ const lag=g>0?0:.15; const tt=Math.max(0,Math.min(1,(t-lag)/.85)); p['f'+s]=vm(a['f'+s],b['f'+s],ease(tt)); p['f'+s]=[p['f'+s][0],p['f'+s][1]+6*Math.sin(Math.PI*tt),p['f'+s][2]]; } });
    return p; },
  kit:(R,u,B,pal)=>matK(R,pal,-14,96,30)});

/* --- PILATES --- */
const legsUp=(p,a,o)=>{ o=o||{}; G.forEach(g=>{ const s=SD(g), hip=vp(p.pel,[0,0,1],g*D3.HW); const aa=(o[s]??a)*RAD; p['f'+s]=vp(hip,[1,0,0],37.6*Math.cos(aa),UP,37.6*Math.sin(aa),[0,0,1],-g*(o.close??1.5)); p['k'+s]=vn(V(UP,Math.cos(aa),[1,0,0],-Math.sin(aa))); p['ff'+s]=vn(V(UP,Math.cos(aa),[1,0,0],-Math.sin(aa))); p['fu'+s]=vn(V([1,0,0],-Math.cos(aa),UP,-Math.sin(aa))); }); return p; };
// The Hundred: cabeza y hombros despegados, piernas arriba; los brazos estirados bombean arriba y abajo
def3('pil_hundred',{cams:[CAMP,CAM34],loop:true,tm:[1000],ico:0,
  pose:u=>{ const p=legsUp(supP({bk:24,head:16}),48); const b=Math.sin(u*Math.PI*2)*3; return withHands(p,(B,g)=>{ const S=B['sho'+SD(g)]; return [[S[0]+26,9.5+b,S[2]+g*2],vn(V(UP,1,[0,0,1],g*.2))]; }); },kit:(R,u,B,pal)=>matK(R,pal,-6,80,30)});
// Roll up: de tumbado con los brazos atrás, se enrolla vértebra a vértebra hasta tocar los pies, y vuelve
def3('pil_roll_up',{cams:[CAMP,CAM34],ph:['Sube','Baja'],tm:[2600,2800],hd:400,
  pose:u=>{ const e=ease(u); const K=[[-89,0,0],[-70,30,18],[-30,34,18],[40,22,14],[58,16,10]]; const k=crv(K,e); const p=supP({pel:[0,6.8,0],lean:k[0],bk:k[1],head:k[2]}); legsUp(p,3,{close:2});
    return withHands(p,(B,g)=>{ const S=B['sho'+SD(g)]; const over=vp(S,B.d2,26.4,B.r2,-g*2); const toes=vp(B['ank'+SD(g)],[1,0,0],1,UP,3); const fw=vp(S,vn(vs(toes,S)),Math.min(26.4,vl(vs(toes,S)))); const w=Math.max(0,Math.min(1,(e-.15)/.35)); return [vm(over,fw,ease(w)),vn(V(UP,-1,B.r2,g*.4))]; }); },kit:(R,u,B,pal)=>matK(R,pal,6,90,30)});
// Círculos de pierna: una pierna en vertical dibuja círculos, la otra estirada en el suelo
def3('pil_circulos',{cams:[CAM34,CAMT],loop:true,tm:[2600],ico:0,
  pose:u=>{ const a=u*Math.PI*2; const p=supP(); legsUp(p,2,{close:1}); const hip=vp(p.pel,[0,0,1],D3.HW); const top=vp(hip,UP,37,[1,0,0],5); p.fR=vp(top,[1,0,0],6*Math.cos(a),[0,0,1],6*Math.sin(a)); p.kR=[1,0,0]; p.ffR=vn([.3,1,0]); p.fuR=vn([-1,.3,0]);
    return withHands(p,(B,g)=>[[B.pel[0]-6,2.4,g*14],vn(V(UP,1,[0,0,1],g*.3))]); },kit:(R,u,B,pal)=>matK(R,pal,-6,80,30)});
// Tijeras: cabeza y hombros arriba; una pierna sube hacia la cara (las manos la sujetan) y la otra baja; cambian
def3('pil_tijeras',{cams:[CAMP,CAM34],loop:true,tm:[2200],ico:.25,
  pose:u=>{ const c=Math.sin(u*Math.PI*2); const p=supP({bk:24,head:16}); legsUp(p,0,{R:mix(48,84,(1+c)/2)-mix(0,30,(1-c)/2),L:mix(48,84,(1-c)/2)-mix(0,30,(1+c)/2),close:3});
    return withHands(p,(B,g)=>{ const hi=c>0?'R':'L'; return [vp(vm(B['knee'+hi],B['ank'+hi],.5),[0,0,1],g*3.5),vn(V(UP,-1,[0,0,1],g*.8))]; }); },kit:(R,u,B,pal)=>matK(R,pal,-6,80,30)});
// Estiramiento de una pierna: una rodilla al pecho con las manos en la espinilla, la otra estirada baja; alternando
def3('pil_una_pierna',{cams:[CAMP,CAM34],loop:true,tm:[2000],ico:.25,
  pose:u=>{ const c=Math.sin(u*Math.PI*2); const p=supP({bk:24,head:16}); G.forEach(g=>{ const s=SD(g), hip=vp(p.pel,[0,0,1],g*D3.HW); const bend=Math.max(0,g*c); const th=vn(V([1,0,0],mix(.92,.25,bend),UP,mix(.38,1,bend))); const kn=vp(hip,th,19.3); const sh=vn(V([1,0,0],1,UP,mix(.38,-.6,bend)));
      p['f'+s]=bend>.02?vp(kn,sh,18.4):vp(hip,th,37.6); p['k'+s]=vn(V(UP,1,[1,0,0],.3)); p['ff'+s]=vn(V(sh,.3,UP,1)); });
    return withHands(p,(B,g)=>{ const hi=c>0?'R':'L'; return [vp(B['knee'+hi],[1,0,0],1,UP,-2,[0,0,1],g*3.5),vn(V(UP,-.5,[0,0,1],g*1))]; }); },kit:(R,u,B,pal)=>matK(R,pal,-6,80,30)});
// Natación: boca abajo con brazos y piernas estirados y despegados; aleteo alterno de brazo y pierna contrarios
def3('pil_natacion',{cams:[CAMP,CAM34],loop:true,tm:[900],ico:.25,
  pose:u=>{ const c=Math.sin(u*Math.PI*2); const p=proneP({bk:-16,head:-10}); G.forEach(g=>{ const s=SD(g); p['f'+s]=[-37.2,8+4*c*-g,g*6.5]; });
    return withHands(p,(B,g)=>{ const S=B['sho'+SD(g)]; return [vp(S,vn(V(B.d2,1,UP,.12+.12*c*g)),26.4,B.r2,g*3),vn(V(UP,1))]; }); },kit:(R,u,B,pal)=>matK(R,pal,-4,96,30)});
// Sierra: sentado con las piernas abiertas y brazos en cruz; gira y lleva la mano al pie contrario, alternando
def3('pil_sierra',{cams:[CAMF,CAM34],loop:true,tm:[4200],ico:.25,
  pose:u=>{ const half=u<.5?1:-1, t=Math.sin((u%.5)*2*Math.PI); const p={pel:[0,6.8,0],lean:mix(4,34,t),bk:mix(0,16,t),twist:half*mix(0,-40,t),head:mix(0,12,t),fR:[33,5.3,17],fL:[33,5.3,-17],kR:[0,1,.1],kL:[0,1,-.1],ffR:vn([.15,1,.1]),ffL:vn([.15,1,-.1])};
    return withHands(p,(B,g)=>{ const S=B['sho'+SD(g)]; const T=vp(S,B.r2,g*26.4); if (g!==-half) return [vm(T,vp(S,B.r2,g*23,B.d2,-2,B.nf,-8),t*.6),vn(V(UP,-1,B.r2,g*.3))]; const foot=vp(B['ank'+SD(half)],[1,0,0],2,UP,2,[0,0,1],half*2); return [vm(T,vp(S,vn(vs(foot,S)),Math.min(26.4,vl(vs(foot,S)))),t),vn(V(UP,1,B.r2,g*.4))]; }); },kit:(R,u,B,pal)=>matK(R,pal,8,64,50)});
// Patada lateral: tumbado de lado; la pierna de arriba va hacia delante y hacia atrás a la altura de la cadera
def3('pil_patada_lateral',{cams:[CAMT,CAMP],loop:true,tm:[1900],ico:.25,
  pose:u=>{ const a=Math.sin(u*Math.PI*2)*45*RAD; const p=sideFloor({fR:[34,4.6,4],kR:[1,0,.2]}); const hipL=vp(p.pel,UP,D3.HW); p.fL=vp(hipL,[1,0,0],37.4*Math.cos(a),[0,0,1],37.4*Math.sin(a),UP,1); p.kL=[0,1,0]; p.ffL=[0,0,1]; p.fuL=[0,1,0];
    return withHands(p,(B,g)=>g>0?[vp(B.shoR,[1,0,0],-26,UP,0),vn(V(UP,-1,[0,0,1],.5))]:[[B.mid[0]+2,2.6,9],vn(V(UP,1,[1,0,0],-.5))]); },kit:(R,u,B,pal)=>matK(R,pal,4,80,30)});
// Rodar como una pelota: hecho una bola (rodillas al pecho, manos en las espinillas), rueda hacia atrás sobre la espalda y vuelve al equilibrio
def3('pil_rodar',{cams:[CAMP,CAM34],ph:['Atrás','Adelante'],tm:[1100,1100],hd:350,
  pose:u=>{ const e=ease(u); const phi=mix(0,72,e); const p={pel:[0,0,0],lean:-28-phi,bk:22,head:26}; const R=[Math.cos(-phi*RAD),Math.sin(-phi*RAD)];

function autoCable(ex,t,P){ // ejercicios de polea sin cable definido: la polea se coloca donde tiene sentido
  const pat=ex.pat, h=P.handN, x=h[0]>50?h[0]+30:h[0]-30;
  if (pat==='tiron_v'||pat==='extension') return [h[0]+6,-4];
  if (pat==='curl'||pat==='elevacion') return [h[0]+26,86];
  if (pat==='tiron_h') return [h[0]+34,h[1]];
  if (pat==='gluteo'||pat==='abduccion'||pat==='curl_pierna'||pat==='bisagra') return [P.ankleN[0]+30,88];
  return [x,40];
}
const AC_CACHE={};
function figureSVG(ex, pose, t, P, pal){
  pal=pal||PAL.mono; P=P||posePoints(t,pose);
  const front=t.v==='front';
  let tt=t;
  if ((ex.eq||[]).includes('pol') && !t.cab && !t.cab2 && !(t.p||[]).some(p=>p[0]==='pull'||p[0]==='cab')) tt=Object.assign({},t,{cab:AC_CACHE[ex.id]||(AC_CACHE[ex.id]=autoCable(ex,t,P))});
  let s='';
  s+=drawProps(tt,P,pal,ex);
  const far=front?pal.n:pal.f, op=front?1:pal.farOp;
  const farG=x=>op<1?`<g opacity="${op}">${x}</g>`:x;
  if (front){
    s+=torsoSVG(P,pal.n,true,pal)+legSVG(P,'F',pal.n,true)+legSVG(P,'N',pal.n,true)+headSVG(P,pal.n,pal,true);
    s+=muscleSVG(ex,P,tt,pal)+drawEquip(ex,tt,P,pal)+armSVG(P,'F',pal.n)+armSVG(P,'N',pal.n);
  } else {
    s+=farG(legSVG(P,'F',far)+armSVG(P,'F',far));
    s+=torsoSVG(P,pal.n,false,pal)+legSVG(P,'N',pal.n)+headSVG(P,pal.n,pal,false);
    s+=muscleSVG(ex,P,tt,pal)+drawEquip(ex,tt,P,pal)+armSVG(P,'N',pal.n);
  }
  if (tt.pf) s+=drawProps({p:tt.pf},P,pal,ex); // equipos que van por delante (almohadillas sobre las piernas…)
  return s;
}
/* encuadre: caja que contiene todas las poses y equipos, cuadrada, con el suelo abajo */
const VB_CACHE={};
function frameOf(ex,t){
  const key=ex.id+'|'+(t._key||''); if (VB_CACHE[key]) return VB_CACHE[key];
  BB=[1e9,1e9,-1e9,-1e9];
  const n=t.k.length, steps=n<2?[0]:[0,.25,.5,.75,1];
  for (let i=0;i<Math.max(1,n);i++) for (const u of steps){ const a=t.k[i], b=t.k[(i+1)%n]||a; figureSVG(ex,n<2?a:lerpPose(a,b,u),t,null,PAL.stage); }
  let [x0,y0,x1,y1]=BB; BB=null;
  const floor=y1>FLOOR_Y-14; if (floor) y1=Math.max(y1,FLOOR_Y)+2.5;
  let w=x1-x0, h=y1-y0; const size=Math.max(62,w+10,h+8)*(t.zoom||1);
  const cx=(x0+x1)/2; const by=floor?y1:(y0+y1)/2+size/2;
  return VB_CACHE[key]=[f1(cx-size/2),f1(by-size),f1(size),f1(size),floor];
}
function figWrap(inner, cls, vb, pal){
  vb=vb||[-8,-12,116,112,true]; pal=pal||PAL.mono;
  const fl=vb[4]?`<rect x="${vb[0]}" y="${FLOOR_Y}" width="${vb[2]}" height="${f1(vb[1]+vb[3]-FLOOR_Y+1)}" fill="${pal.floor}" opacity="${pal.floorOp*.45}"/><line x1="${vb[0]}" y1="${FLOOR_Y}" x2="${f1(vb[0]+vb[2])}" y2="${FLOOR_Y}" stroke="${pal.floor}" stroke-width="1.1" opacity="${pal.floorOp*1.6}"/>`:'';
  return `<svg class="${cls||''}" viewBox="${vb.slice(0,4).join(' ')}" width="100%" height="100%" fill="none" stroke-linecap="round" stroke-linejoin="round">${fl}${inner}</svg>`;
}
const a3of=ex=>ANIM3[ex.id]||(ex.custom&&ex.like?ANIM3[ex.like]:null);
const ICON_CACHE={};
function exFigureStatic(ex, pal){
  const A3=a3of(ex); if (A3){ const st=pal==='stage', key=ex.id+(st?'|s3':'|3')+(st&&animMusOn()?'|m':''); if (ICON_CACHE[key]) return ICON_CACHE[key];
    const P_=st?PAL.stage:PAL.mono; return ICON_CACHE[key]=figWrap(render3(st?exMus(ex):ex,A3,A3.ico??1,P_,0),'',frame3(ex,A3,0),P_); }
  const st=pal==='stage', key=ex.id+(st?'|s':'')+(st&&animMusOn()?'|m':''); if (ICON_CACHE[key]) return ICON_CACHE[key];
  const t=tplFor(ex); const i=t.ico!=null?t.ico:t.k.length-1;
  const P_=st?PAL.stage:PAL.mono;
  return ICON_CACHE[key]=figWrap(figureSVG(st?exMus(ex):ex,t.k[i],t,null,P_),'',frameOf(ex,t),P_);
}
function exIcon(ex, big){
  const cls = big==='sm'?'exi sm':big?'exi lg':'exi';
  const c = exColor(ex);
  if (ex.custom && !ex.like) return `<div class="${cls}" style="background:${c}22;color:${c}"><span class="ini">${esc((ex.n||'?').slice(0,2).toUpperCase())}</span></div>`;
  return `<div class="${cls}" style="background:linear-gradient(145deg,${c},${c}c8)"><div class="exfig">${exFigureStatic(ex)}</div></div>`;
